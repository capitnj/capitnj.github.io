<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Colleges — CapItNJ</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="nav">
        <div class="nav-inner">
            <a href="index.html" class="wordmark">CapItNJ</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="improve.html">Improve</a>
                <a href="explore.html" class="active">Explore</a>
                <a href="matches.html">Matches</a>
                <a href="mylist.html">My List</a>
                <a href="profile.html">Profile</a>
                <a href="login.html" id="nav-login-btn">Log in</a>
            </div>
        </div>
    </header>
 
    <main>
        <div class="wrap">
            <!-- HERO -->
            <section style="background: var(--accent); color: #fff; padding: 48px 24px; margin: 0 -24px 0; margin-bottom: 32px;">
                <div style="max-width: var(--max-w); margin: 0 auto;">
                    <p class="eyebrow" style="color: rgba(255,255,255,0.6); margin-bottom: 20px;">BROWSE THE DATABASE</p>
                    <h1 style="color: #fff; margin: 0;">Every school in CapItNJ</h1>
                    <p style="color: rgba(255,255,255,0.85); font-size: 15px; margin: 12px 0 0; max-width: 460px;">No profile needed — filter freely, or <a href="login.html" style="color: #fff; text-decoration: underline;">log in</a> to get a ranked, personalized list instead.</p>
                </div>
            </section>
 
            <!-- SEARCH & FILTERS -->
            <section style="padding: 0 0 28px; margin-bottom: 24px;">
                <div class="explore-controls">
                    <input type="text" id="zip-search" placeholder="Search by ZIP code..." maxlength="5" pattern="[0-9]{5}" style="flex: 1; min-width: 180px;">
                    <button class="btn" onclick="searchByZip()" style="padding: 9px 20px; font-size: 13px;">Search</button>
                    <button class="link-btn" onclick="clearSearch()" style="padding: 9px 0; font-size: 13px;">Clear</button>
                </div>
                <p class="explore-count" id="college-count">Loading colleges...</p>
            </section>
 
            <!-- RESULTS -->
            <section id="colleges-container" style="padding: 0;">
                <p style="text-align: center; color: var(--ink-faint); padding: 40px 0;">Loading...</p>
            </section>
        </div>
    </main>
 
    <footer class="home-footer">
        <div class="wrap">
            <p>© 2024 CapItNJ. Built for the Congressional App Challenge.</p>
        </div>
    </footer>
 
    <script src="data.js"></script>
    <script>
        let allColleges = [];
        let currentFilter = null;
 
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof collegesData !== 'undefined') {
                allColleges = collegesData;
                displayColleges(allColleges);
            }
 
            document.getElementById('zip-search').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchByZip();
            });
        });
 
        function displayColleges(colleges) {
            const container = document.getElementById('colleges-container');
            const count = colleges.length;
 
            if (!colleges || colleges.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--ink-faint); padding: 40px 0;">No colleges found. Try adjusting your search.</p>';
                document.getElementById('college-count').textContent = '0 schools';
                return;
            }
 
            let html = '';
            colleges.forEach(college => {
                const isSaved = isSavedCollege(college.id);
                html += `
                    <div class="explore-row" style="padding: 20px 0;">
                        <div style="flex: 1;">
                            <div class="explore-row-name">${college.name}</div>
                            <div class="explore-row-meta">${college.type || 'University'} · ${college.city || 'N/A'} · ${college.state}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                            <span class="explore-row-tag">${college.state}</span>
                            <button class="btn" style="padding: 8px 16px; font-size: 12px; background: var(--accent);" onclick="toggleSave('${college.id}', '${college.name.replace(/'/g, "\\'")}', this)">
                                <span class="save-text-${college.id}">${isSaved ? 'Saved ✓' : 'Save'}</span>
                            </button>
                        </div>
                    </div>
                `;
            });
 
            container.innerHTML = html;
            document.getElementById('college-count').textContent = count + ' schools' + (currentFilter ? ' (filtered)' : '');
        }
 
        function searchByZip() {
            const zip = document.getElementById('zip-search').value.trim();
 
            if (!zip) {
                alert('Please enter a ZIP code');
                return;
            }
 
            if (!/^\d{5}$/.test(zip)) {
                alert('Please enter a valid 5-digit ZIP code');
                return;
            }
 
            currentFilter = zip;
            const filtered = allColleges.filter(college => 
                college.zip === zip || (college.zip && college.zip.substring(0, 3) === zip.substring(0, 3))
            );
 
            displayColleges(filtered);
        }
 
        function clearSearch() {
            document.getElementById('zip-search').value = '';
            currentFilter = null;
            displayColleges(allColleges);
        }
 
        function isSavedCollege(collegeId) {
            const saved = JSON.parse(localStorage.getItem('savedColleges') || '[]');
            return saved.some(c => c.id === collegeId);
        }
 
        function toggleSave(collegeId, collegeName, btn) {
            let saved = JSON.parse(localStorage.getItem('savedColleges') || '[]');
            const isSaved = saved.some(c => c.id === collegeId);
 
            if (isSaved) {
                saved = saved.filter(c => c.id !== collegeId);
                document.querySelector('.save-text-' + collegeId).textContent = 'Save';
            } else {
                saved.push({ id: collegeId, name: collegeName });
                document.querySelector('.save-text-' + collegeId).textContent = 'Saved ✓';
            }
 
            localStorage.setItem('savedColleges', JSON.stringify(saved));
        }
    </script>
</body>
</html>
