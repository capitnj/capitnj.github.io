<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CapItNJ — Matches</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
        .matches-header {
            margin-bottom: 38px;
        }

        .matches-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .summary-pill {
            font-size: 12px;
            color: var(--ink-soft);
            background: var(--surface);
            border: 1px solid var(--line);
            padding: 7px 11px;
            border-radius: 4px;
        }

        .summary-pill strong {
            color: var(--ink);
            font-weight: 600;
        }

        .match-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 22px;
        }

        .filter-btn {
            font-family: Inter, sans-serif;
            font-size: 12px;
            font-weight: 500;
            background: var(--surface);
            color: var(--ink-soft);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 8px 13px;
            cursor: pointer;
        }

        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .match-count {
            font-family: "IBM Plex Mono", monospace;
            color: var(--ink-faint);
            font-size: 11px;
            margin: 0 0 14px;
        }

        .match-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 21px;
            margin-bottom: 12px;
        }

        .match-card:hover {
            border-color: #c9cdd4;
        }

        .match-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-start;
        }

        .match-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--ink);
            margin: 0;
        }

        .match-meta {
            color: var(--ink-soft);
            font-size: 13px;
            margin-top: 6px;
        }

        .match-score-box {
            text-align: right;
            flex-shrink: 0;
        }

        .match-score {
            font-family: "IBM Plex Mono", monospace;
            font-size: 24px;
            font-weight: 500;
            color: var(--ink);
        }

        .match-score-label {
            font-size: 10px;
            color: var(--ink-faint);
            text-transform: uppercase;
            letter-spacing: .06em;
            margin-top: 3px;
        }

        .match-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 17px;
        }

        .match-tag {
            font-size: 11px;
            padding: 5px 9px;
            border-radius: 3px;
            background: var(--accent-bg);
            color: var(--accent);
        }

        .match-tag.reach {
            background: #fff0ea;
            color: #c2542a;
        }

        .match-tag.match {
            background: #edf9f0;
            color: #23823d;
        }

        .match-tag.safety {
            background: #edf5ff;
            color: #2871b8;
        }

        .match-info {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            padding-top: 15px;
            margin-top: 16px;
            border-top: 1px solid var(--line);
            color: var(--ink-soft);
            font-size: 12px;
        }

        .match-actions {
            margin-top: 17px;
            display: flex;
            justify-content: flex-end;
        }

        .save-match-btn {
            background: #16a34a;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 8px 15px;
            font-family: Inter, sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        .save-match-btn:hover {
            background: #15803d;
        }

        .save-match-btn:disabled {
            opacity: .65;
            cursor: default;
        }

        .empty-state,
        .login-gate {
            text-align: center;
            padding: 52px 24px;
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        .empty-state h2,
        .login-gate h2 {
            font-family: Fraunces, serif;
            font-size: 24px;
            margin: 0 0 10px;
        }

        .empty-state p,
        .login-gate p {
            color: var(--ink-soft);
            margin: 0 auto 18px;
            max-width: 480px;
            line-height: 1.6;
        }

        .btn-link {
            display: inline-block;
            background: var(--accent);
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            .match-top {
                flex-direction: column;
                gap: 12px;
            }

            .match-score-box {
                text-align: left;
            }
        }
    </style>
</head>

<!-- FIREBASE COMPAT -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script src="firebase-init.js"></script>
<script src="data.js"></script>


<script>
(function () {

    "use strict";


    let currentUser = null;
    let currentProfile = null;
    let allMatches = [];
    let activeFilter = "all";


    const content = document.getElementById("matches-content");


    /* =====================================================
       HELPERS
    ===================================================== */

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value == null ? "" : String(value);
        return div.innerHTML;
    }


    function getCollegeData() {

        /*
         * Supports both versions of the project data.
         */

        if (
            typeof window.COLLEGES !== "undefined" &&
            Array.isArray(window.COLLEGES) &&
            window.COLLEGES.length > 0
        ) {
            return window.COLLEGES;
        }

        if (
            typeof collegesData !== "undefined" &&
            Array.isArray(collegesData) &&
            collegesData.length > 0
        ) {
            return collegesData;
        }

        if (
            typeof window.collegesData !== "undefined" &&
            Array.isArray(window.collegesData) &&
            window.collegesData.length > 0
        ) {
            return window.collegesData;
        }

        return [];
    }


    function numberValue(value) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return 0;
        }

        const cleaned = String(value)
            .replace(/[$,]/g, "")
            .trim();

        const number = Number(cleaned);

        return Number.isFinite(number)
            ? number
            : 0;
    }


    function formatMoney(value) {

        const number = numberValue(value);

        if (!number) {
            return "N/A";
        }

        return "$" + Math.round(number).toLocaleString();
    }


    function getCollegeGPA(college) {

        return numberValue(
            college.avgGPA ||
            college.avgGpa ||
            college.gpa ||
            college.averageGPA
        );
    }


    function getCollegePrice(college) {

        return numberValue(
            college.netPrice ||
            college.averageNetPrice ||
            college.tuition ||
            college.cost
        );
    }


    function normalize(value) {
        return String(value || "")
            .trim()
            .toLowerCase();
    }


    /* =====================================================
       LOCATION MATCHING
    ===================================================== */

    const NORTHEAST_STATES = [
        "ME", "NH", "VT", "MA", "RI",
        "CT", "NY", "NJ", "PA"
    ];

    const MIDWEST_STATES = [
        "OH", "IN", "IL", "MI", "WI",
        "MN", "IA", "MO", "ND", "SD",
        "NE", "KS"
    ];

    const SOUTH_STATES = [
        "DE", "MD", "DC", "VA", "WV",
        "NC", "SC", "GA", "FL", "KY",
        "TN", "MS", "AL", "OK", "TX",
        "AR", "LA"
    ];

    const WEST_STATES = [
        "MT", "ID", "WY", "CO", "NM",
        "AZ", "UT", "NV", "CA", "OR",
        "WA", "AK", "HI"
    ];


    function getLocationScore(profile, college) {

        const preference = normalize(
            profile.preferredLocation
        );

        const state = String(
            college.state || ""
        ).trim().toUpperCase();


        /*
         * No preference = don't punish the college.
         */

        if (
            !preference ||
            preference === "anywhere"
        ) {
            return {
                points: 0,
                reason: ""
            };
        }


        if (
            preference === "nj" ||
            preference === "new jersey"
        ) {

            if (state === "NJ") {
                return {
                    points: 12,
                    reason: "Matches your New Jersey preference"
                };
            }

            return {
                points: -2,
                reason: ""
            };
        }


        if (preference === "northeast") {

            if (NORTHEAST_STATES.includes(state)) {
                return {
                    points: 12,
                    reason: "Matches your Northeast preference"
                };
            }
        }


        if (preference === "midwest") {

            if (MIDWEST_STATES.includes(state)) {
                return {
                    points: 12,
                    reason: "Matches your Midwest preference"
                };
            }
        }


        if (preference === "south") {

            if (SOUTH_STATES.includes(state)) {
                return {
                    points: 12,
                    reason: "Matches your South preference"
                };
            }
        }


        if (preference === "west") {

            if (WEST_STATES.includes(state)) {
                return {
                    points: 12,
                    reason: "Matches your West preference"
                };
            }
        }


        return {
            points: 0,
            reason: ""
        };
    }


    /* =====================================================
       MATCH CALCULATION
    ===================================================== */

    function calculateMatch(profile, college) {

        let score = 50;

        const reasons = [];


        const studentGPA = numberValue(profile.gpa);
        const studentBudget = numberValue(profile.budget);

        const collegeGPA = getCollegeGPA(college);
        const collegePrice = getCollegePrice(college);


        /* -------------------------
           GPA
        ------------------------- */

        if (
            studentGPA > 0 &&
            collegeGPA > 0
        ) {

            const difference =
                studentGPA - collegeGPA;


            if (difference >= 0.50) {

                score += 25;

                reasons.push(
                    "Your GPA is well above this school's typical GPA"
                );

            } else if (difference >= 0.15) {

                score += 20;

                reasons.push(
                    "Your GPA is a strong fit"
                );

            } else if (difference >= -0.20) {

                score += 14;

                reasons.push(
                    "Your GPA is close to this school's range"
                );

            } else if (difference >= -0.50) {

                score += 4;

                reasons.push(
                    "This is a competitive academic match"
                );

            } else {

                score -= 20;

                reasons.push(
                    "Your GPA makes this more of a reach"
                );
            }
        }


        /* -------------------------
           BUDGET
        ------------------------- */

        if (
            studentBudget > 0 &&
            collegePrice > 0
        ) {

            if (
                collegePrice <= studentBudget * 0.75
            ) {

                score += 20;

                reasons.push(
                    "Well within your annual budget"
                );

            } else if (
                collegePrice <= studentBudget
            ) {

                score += 16;

                reasons.push(
                    "Fits within your annual budget"
                );

            } else if (
                collegePrice <= studentBudget * 1.15
            ) {

                score += 5;

                reasons.push(
                    "Close to your budget"
                );

            } else {

                score -= 14;

                reasons.push(
                    "Estimated cost is above your budget"
                );
            }
        }


        /* -------------------------
           LOCATION
        ------------------------- */

        const locationResult =
            getLocationScore(profile, college);

        score += locationResult.points;

        if (locationResult.reason) {
            reasons.push(locationResult.reason);
        }


        /*
         * Keep score between 1 and 99.
         */

        score = Math.max(
            1,
            Math.min(
                99,
                Math.round(score)
            )
        );


        let category;


        if (score < 50) {

            category = "reach";

        } else if (score >= 78) {

            category = "safety";

        } else {

            category = "match";
        }


        return {
            score: score,
            category: category,
            reasons: reasons
        };
    }


    /* =====================================================
       BUILD MATCHES
    ===================================================== */

    function buildMatches() {

        const colleges = getCollegeData();


        if (!colleges.length) {

            console.error(
                "No college data found.",
                {
                    COLLEGES: window.COLLEGES,
                    collegesData:
                        typeof collegesData !== "undefined"
                            ? collegesData
                            : undefined
                }
            );

            content.innerHTML = `
                <div class="empty-state">
                    <h2>College data couldn't load</h2>
                    <p>
                        Your profile loaded, but the college database
                        wasn't available yet.
                    </p>
                </div>
            `;

            return;
        }


        allMatches = colleges
            .filter(function (college) {

                return college &&
                    college.name;

            })
            .map(function (college) {

                const result =
                    calculateMatch(
                        currentProfile,
                        college
                    );


                return {
                    college: college,
                    score: result.score,
                    category: result.category,
                    reasons: result.reasons
                };
            })
            .sort(function (a, b) {

                return b.score - a.score;

            });


        renderMatchesPage();
    }


    /* =====================================================
       RENDER PAGE
    ===================================================== */

    function renderMatchesPage() {

        const gpa =
            numberValue(currentProfile.gpa);

        const budget =
            numberValue(currentProfile.budget);

        const location =
            currentProfile.preferredLocation || "Anywhere";


        content.innerHTML = `

            <div class="matches-summary">

                ${
                    gpa
                        ? `
                            <div class="summary-pill">
                                <strong>GPA:</strong>
                                ${escapeHtml(gpa)}
                            </div>
                        `
                        : ""
                }

                ${
                    budget
                        ? `
                            <div class="summary-pill">
                                <strong>Budget:</strong>
                                ${escapeHtml(formatMoney(budget))}/yr
                            </div>
                        `
                        : ""
                }

                <div class="summary-pill">
                    <strong>Location:</strong>
                    ${escapeHtml(location)}
                </div>

            </div>


            <div class="match-filters">

                <button
                    class="filter-btn active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    class="filter-btn"
                    data-filter="reach"
                >
                    Reach
                </button>

                <button
                    class="filter-btn"
                    data-filter="match"
                >
                    Match
                </button>

                <button
                    class="filter-btn"
                    data-filter="safety"
                >
                    Safety
                </button>

            </div>


            <p
                id="match-count"
                class="match-count"
            ></p>


            <div id="matches-list"></div>

        `;


        document
            .querySelectorAll(".filter-btn")
            .forEach(function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        activeFilter =
                            button.dataset.filter;


                        document
                            .querySelectorAll(".filter-btn")
                            .forEach(function (item) {

                                item.classList.remove(
                                    "active"
                                );

                            });


                        button.classList.add(
                            "active"
                        );


                        renderMatchCards();

                    }
                );

            });


        renderMatchCards();
    }


    /* =====================================================
       RENDER CARDS
    ===================================================== */

    function renderMatchCards() {

        const list =
            document.getElementById(
                "matches-list"
            );


        const count =
            document.getElementById(
                "match-count"
            );


        if (!list || !count) {
            return;
        }


        let visibleMatches =
            allMatches;


        if (activeFilter !== "all") {

            visibleMatches =
                allMatches.filter(
                    function (item) {

                        return item.category ===
                            activeFilter;

                    }
                );
        }


        count.textContent =
            visibleMatches.length +
            " college" +
            (
                visibleMatches.length === 1
                    ? ""
                    : "s"
            ) +
            (
                activeFilter === "all"
                    ? " ranked"
                    : " in this category"
            );


        /*
         * Show first 100 so the page stays fast.
         */

        const matchesToShow =
            visibleMatches.slice(0, 100);


        if (!matchesToShow.length) {

            list.innerHTML = `
                <div class="empty-state">
                    <h2>No colleges here yet</h2>
                    <p>
                        Try another match category.
                    </p>
                </div>
            `;

            return;
        }


        list.innerHTML =
            matchesToShow
                .map(function (item) {

                    const college =
                        item.college;


                    const collegeGPA =
                        getCollegeGPA(college);


                    const collegePrice =
                        getCollegePrice(college);


                    const collegeId =
                        String(
                            college.id ||
                            college.name
                        );


                    const reasons =
                        item.reasons
                            .slice(0, 3)
                            .map(function (reason) {

                                return `
                                    <span class="match-tag">
                                        ${escapeHtml(reason)}
                                    </span>
                                `;

                            })
                            .join("");


                    return `

                        <article class="match-card">

                            <div class="match-top">

                                <div>

                                    <h2 class="match-name">
                                        ${escapeHtml(college.name)}
                                    </h2>


                                    <div class="match-meta">

                                        ${escapeHtml(
                                            [
                                                college.type,
                                                college.setting,
                                                college.state,
                                                college.country
                                            ]
                                                .filter(Boolean)
                                                .join(" · ")
                                        )}

                                    </div>

                                </div>


                                <div class="match-score-box">

                                    <div class="match-score">
                                        ${item.score}%
                                    </div>

                                    <div class="match-score-label">
                                        profile fit
                                    </div>

                                </div>

                            </div>


                            <div class="match-tags">

                                <span
                                    class="match-tag ${item.category}"
                                >
                                    ${escapeHtml(
                                        item.category
                                            .toUpperCase()
                                    )}
                                </span>

                                ${reasons}

                            </div>


                            <div class="match-info">

                                <span>
                                    Typical GPA:
                                    ${
                                        collegeGPA
                                            ? escapeHtml(collegeGPA)
                                            : "N/A"
                                    }
                                </span>


                                <span>
                                    Est. cost:
                                    ${escapeHtml(
                                        formatMoney(
                                            collegePrice
                                        )
                                    )}
                                </span>

                            </div>


                            <div class="match-actions">

                                <button
                                    class="save-match-btn"
                                    data-college-id="${escapeHtml(collegeId)}"
                                >
                                    Save to My List
                                </button>

                            </div>

                        </article>

                    `;

                })
                .join("");


        if (visibleMatches.length > 100) {

            count.textContent +=
                " · showing top 100";

        }


        document
            .querySelectorAll(".save-match-btn")
            .forEach(function (button) {

                button.addEventListener(
                    "click",
                    async function () {

                        const id =
                            button.dataset.collegeId;


                        const item =
                            allMatches.find(
                                function (match) {

                                    return String(
                                        match.college.id ||
                                        match.college.name
                                    ) === id;

                                }
                            );


                        if (!item) {
                            return;
                        }


                        await saveCollege(
                            item.college,
                            button
                        );

                    }
                );

            });
    }


    /* =====================================================
       SAVE TO MY LIST
    ===================================================== */

    async function saveCollege(
        college,
        button
    ) {

        if (!currentUser) {

            alert(
                "Please log in first."
            );

            return;
        }


        button.disabled = true;
        button.textContent = "Saving...";


        try {

            /*
             * Save locally in the format My List expects.
             */

            let savedColleges;


            try {

                savedColleges =
                    JSON.parse(
                        localStorage.getItem(
                            "savedColleges"
                        ) || "[]"
                    );

            } catch (error) {

                savedColleges = [];

            }


            if (
                !Array.isArray(savedColleges)
            ) {

                savedColleges = [];

            }


            const collegeId =
                college.id ||
                college.name;


            const alreadySaved =
                savedColleges.some(
                    function (saved) {

                        return String(
                            saved.id
                        ) === String(
                            collegeId
                        );

                    }
                );


            if (!alreadySaved) {

                savedColleges.push({
                    id: collegeId,
                    name: college.name
                });


                localStorage.setItem(
                    "savedColleges",
                    JSON.stringify(
                        savedColleges
                    )
                );
            }


            /*
             * Also save in Firebase.
             *
             * DIRECT COMPAT FIRESTORE SYNTAX.
             * No firestoreFns.doc wrapper here.
             */

            const safeDocumentId =
                String(collegeId)
                    .replace(
                        /[\/.#$[\]]/g,
                        "_"
                    );


            await window.capitnjFirebase.db
                .collection("users")
                .doc(currentUser.uid)
                .collection("savedColleges")
                .doc(safeDocumentId)
                .set({
                    id: collegeId,
                    name: college.name || "",
                    state: college.state || "",
                    country: college.country || "",
                    priority: "Considering",
                    source: "Matches",
                    savedAt: new Date().toISOString()
                });


            button.textContent = "Saved ✓";

        } catch (error) {

            console.error(
                "Error saving college:",
                error
            );


            button.disabled = false;
            button.textContent =
                "Save to My List";

        }
    }


    /* =====================================================
       LOAD PROFILE
    ===================================================== */

    async function loadProfile(user) {

        try {

            /*
             * THIS IS THE IMPORTANT FIX.
             *
             * Directly matches the working Profile page:
             *
             * db.collection("users").doc(user.uid).get()
             */

            const profileSnapshot =
                await window.capitnjFirebase.db
                    .collection("users")
                    .doc(user.uid)
                    .get();


            let profile;


            if (
                profileSnapshot.exists
            ) {

                profile =
                    profileSnapshot.data();

            } else {

                /*
                 * If no Firestore profile exists,
                 * try the local copy.
                 */

                const localProfile =
                    localStorage.getItem(
                        "userProfile"
                    );


                profile =
                    localProfile
                        ? JSON.parse(localProfile)
                        : null;
            }


            if (!profile) {

                content.innerHTML = `

                    <div class="empty-state">

                        <h2>Finish your profile first</h2>

                        <p>
                            Add your GPA, annual budget, and location
                            preferences so CapItNJ can rank colleges
                            for you.
                        </p>

                        <a
                            href="profile.html"
                            class="btn-link"
                        >
                            Go to Profile
                        </a>

                    </div>

                `;

                return;
            }


            /*
             * Normalize the exact fields used
             * by Profile.
             */

            currentProfile = {

                name:
                    profile.name || "",

                email:
                    profile.email ||
                    user.email ||
                    "",

                state:
                    profile.state || "",

                gpa:
                    profile.gpa !== undefined
                        ? profile.gpa
                        : "",

                sat:
                    profile.sat || null,

                act:
                    profile.act || null,

                budget:
                    profile.budget !== undefined
                        ? profile.budget
                        : "",

                preferredLocation:
                    profile.preferredLocation ||
                    ""

            };


            /*
             * Keep My List and other pages synced.
             */

            localStorage.setItem(
                "userProfile",
                JSON.stringify(
                    currentProfile
                )
            );


            buildMatches();

        } catch (error) {

            console.error(
                "Could not load profile:",
                error
            );


            /*
             * Last-resort fallback:
             * localStorage profile.
             */

            try {

                const localProfile =
                    JSON.parse(
                        localStorage.getItem(
                            "userProfile"
                        ) || "null"
                    );


                if (localProfile) {

                    currentProfile =
                        localProfile;

                    buildMatches();

                    return;
                }

            } catch (localError) {

                console.error(
                    "Local profile fallback failed:",
                    localError
                );

            }


            content.innerHTML = `

                <div class="empty-state">

                    <h2>We couldn't load your profile</h2>

                    <p>
                        Please refresh and try again.
                    </p>

                </div>

            `;
        }
    }


    /* =====================================================
       START APP
    ===================================================== */

    function startMatches() {

        if (
            !window.capitnjFirebase ||
            !window.capitnjFirebase.auth ||
            !window.capitnjFirebase.db
        ) {

            window.addEventListener(
                "firebase-ready",
                startMatches,
                { once: true }
            );

            return;
        }


        /*
         * Direct auth listener.
         * No .ready.
         * No module imports.
         * No wrapper argument mismatch.
         */

        window.capitnjFirebase.auth
            .onAuthStateChanged(
                function (user) {

                    if (!user) {

                        content.innerHTML = `

                            <div class="login-gate">

                                <h2>
                                    Log in to get your matches
                                </h2>

                                <p>
                                    Your saved GPA, budget, and location
                                    preferences are used to rank colleges
                                    for you.
                                </p>

                                <a
                                    href="login.html"
                                    class="btn-link"
                                >
                                    Log in
                                </a>

                            </div>

                        `;

                        return;
                    }


                    currentUser = user;

                    loadProfile(user);

                }
            );
    }


    startMatches();

})();
</script>

</body>
</html>
