<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapItNJ — Matches</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="nav">
        <div class="nav-inner">
            <a href="index.html" class="wordmark">CapItNJ</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="improve.html">Improve</a>
                <a href="explore.html">Explore</a>
                <a href="matches.html" class="active">Matches</a>
                <a href="mylist.html">My List</a>
                <a href="profile.html">Profile</a>
            </div>
        </div>
    </header>
    <main>
        <div class="wrap">
            <p class="eyebrow">Your matches</p>
            <h1>Ranked for you</h1>
            <p class="subtitle">Based on the profile you saved — grouped by how they fit your budget, not just a single list.</p>

            <div id="no-profile" class="empty-state" style="display:none">
                You haven't customized your budget preferences yet. <a href="profile.html" style="text-decoration:underline">Go to Profile</a> to set your tuition cap and location preference.
            </div>
            <div id="results-groups"></div>
        </div>
    </main>

    <script type="module" src="firebase-init.js"></script>
    <script src="data.js"></script>
    <script type="module">
        if (!window.capitnjFirebase?.ready) {
            await new Promise((resolve) => window.addEventListener("firebase-ready", resolve, { once: true }));
        }
        const firebase = await window.capitnjFirebase.ready;
        const { requireAuth } = firebase;
        const { doc, getDoc, setDoc } = firebase.firestoreFns;
        const db = firebase.db;

        const FALLBACK_NET_PRICE = 22000; // single source of truth, used by both filter and card
        let currentUser = null;

        function formatCurrency(num) {
            return '$' + Number(num).toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 0});
        }

        function sanitizeId(name) {
            return name.replace(/[^a-zA-Z0-9]/g, '');
        }

        requireAuth(async (user) => {
            currentUser = user;
            const userDocRef = doc(db, "users", user.uid);
            let data = null;

            try {
                const docSnap = await getDoc(userDocRef);
                data = docSnap.exists() ? docSnap.data() : null;
            } catch (error) {
                console.error("Error reading matches database profile:", error);
            }

            if (!data || !data.maxTuition) {
                document.getElementById('no-profile').style.display = 'block';
                return;
            }

            const maxBudget = parseFloat(data.maxTuition) || 999999;
            const preferredLoc = data.preferredLocation || 'any';

            const matchedColleges = (window.COLLEGES || []).filter(c => {
                const netPrice = c.netPrice || FALLBACK_NET_PRICE;
                if (netPrice > maxBudget) return false;

                // NJ preference variants (north/central/south) all map to the same
                // 'NJ' state value in data.js today — there's no finer-grained region
                // field yet, so all three currently behave identically.
                if (preferredLoc === 'north-nj' || preferredLoc === 'central-nj' || preferredLoc === 'south-nj') {
                    if (c.state !== 'NJ') return false;
                } else if (preferredLoc === 'out-of-state') {
                    if (c.state === 'NJ') return false;
                }
                // preferredLoc === 'any' → no location filtering
                return true;
            });

            renderGroups(matchedColleges, maxBudget, preferredLoc);
        });

        function cardHtml(college, maxBudget) {
            const price = college.netPrice || FALLBACK_NET_PRICE;
            const statusLabel = price <= maxBudget * 0.8 ? "✓ Safe Budget Choice" : "⚠ Near Your Limit";
            const statusColor = price <= maxBudget * 0.8 ? "#10b981" : "#f59e0b";
            const uid = sanitizeId(college.name);

            return `
                <div class="result-card" style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 16px; background: white;">
                    <div class="result-top" style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <div class="result-name" style="font-weight: 600; font-size: 18px; color: #111;">${college.name}</div>
                            <div class="result-meta" style="color: #666; font-size: 13px; margin-top: 4px;">
                                ${college.type} · ${college.setting} · ${college.state}, ${college.country}
                            </div>
                        </div>
                        <div style="text-align:right">
                            <div class="result-price-label" style="font-size: 11px; text-transform: uppercase; color: #888; font-weight: 500;">Est. cost / yr</div>
                            <div class="result-price" style="font-size: 20px; font-weight: 700; color: #111; margin-top: 2px;">${formatCurrency(price)}</div>
                        </div>
                    </div>
                    <div class="result-tip" style="margin-top: 14px; padding-top: 12px; border-top: 1px dashed #e2e8f0; font-size: 14px; color: ${statusColor}; font-weight: 500;">
                        ${statusLabel} — Estimated costs fit inside your parameters. Keep tabs on local scholarship updates in your Improve tab!
                    </div>
                    <div style="margin-top: 15px; padding: 12px; background: #fafafa; border-radius: 6px; border: 1px dashed #ddd; display: flex; flex-direction: column; gap: 10px;">
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <label style="font-size: 13px; font-weight: 500; color: #111;">Rank Priority:</label>
                            <select id="rank-${uid}" style="padding: 4px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px;">
                                <option value="Top Choice">🥇 Top Choice / #1 Pick</option>
                                <option value="Target School" selected>🥈 Strong Target</option>
                                <option value="Safety Backup">🥉 Safety Backup</option>
                            </select>
                        </div>
                        <textarea id="notes-${uid}" placeholder="Add your research notes (e.g. Spoke to counselor, requires extra essays)" style="width: 100%; min-height: 50px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: inherit; resize: vertical; box-sizing: border-box;"></textarea>
                        <button class="btn-save-match" data-uid="${uid}" data-name="${encodeURIComponent(college.name)}" data-state="${college.state}" style="background: #111; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-size: 13px; font-weight: 500; cursor: pointer; align-self: flex-start;">✨ Save to My List</button>
                    </div>
                </div>
            `;
        }

        function sectionHtml(title, subtitle, items, maxBudget) {
            if (items.length === 0) return '';
            const cards = items.map((c) => cardHtml(c, maxBudget)).join('');
            return `
                <section class="result-section" style="margin-bottom: 40px;">
                    <div class="result-section-head" style="margin-bottom: 16px;">
                        <h2 style="font-family: 'Fraunces', serif; font-size: 24px; color: #111;">${title}</h2>
                        <p style="color: #666; font-size: 14px; margin-top: 2px;">${subtitle}</p>
                    </div>
                    ${cards}
                </section>
            `;
        }

        function attachSaveHandlers() {
            document.querySelectorAll('.btn-save-match').forEach(btn => {
                btn.addEventListener('click', () => {
                    const uid = btn.getAttribute('data-uid');
                    const name = decodeURIComponent(btn.getAttribute('data-name'));
                    const state = btn.getAttribute('data-state');
                    saveCollegeToList(name, state, uid);
                });
            });
        }

        async function saveCollegeToList(collegeName, state, uid) {
            if (!currentUser) {
                alert("Please sign in first to save colleges to your dashboard list!");
                return;
            }

            const rankSelection = document.getElementById(`rank-${uid}`).value;
            const noteContent = document.getElementById(`notes-${uid}`).value;

            try {
                await setDoc(doc(db, "users", currentUser.uid, "savedColleges", uid), {
                    name: collegeName,
                    state: state,
                    rate: "N/A",
                    priority: rankSelection,
                    notes: noteContent,
                    timestamp: new Date().toISOString()
                });
                alert(`🎉 Successfully saved ${collegeName} to your list!`);
            } catch (err) {
                console.error("Cloud storage sync failed:", err);
                alert("Failed to save college data. Make sure you are signed in.");
            }
        }

        function renderGroups(colleges, maxBudget, preferredLoc) {
            const wrap = document.getElementById('results-groups');
            wrap.innerHTML = '';

            if (colleges.length === 0) {
                wrap.innerHTML = `<div class="empty-state" style="padding: 40px; text-align: center; color: #666;">No schools match your budget threshold currently — try widening your tuition cap on your Profile page.</div>`;
                return;
            }

            function isUS(country) {
                if (!country) return true;
                const c = country.trim().toLowerCase();
                return c === 'us' || c === 'usa' || c === 'united states' || c === 'united states of america';
            }
            const nearHome = colleges.filter(c => c.state === 'NJ');
            const outsideNJ = colleges.filter(c => c.state !== 'NJ' && isUS(c.country));
            const international = colleges.filter(c => !isUS(c.country));

            let html = '';
            html += sectionHtml('Near Home', 'Colleges close by inside New Jersey state bounds.', nearHome, maxBudget);
            html += sectionHtml('Outside NJ', 'Options located across other US states.', outsideNJ, maxBudget);
            html += sectionHtml('Out of Country', 'International paths that expand your options.', international, maxBudget);

            wrap.innerHTML = html || `<div class="empty-state" style="padding: 40px; text-align: center; color: #666;">No schools match your exact criteria. Try adjusting your preferences.</div>`;
            attachSaveHandlers();
        }
    </script>
</body>
</html>
