    }

    .profile-pill {
      border: 1px solid var(--line);

    }

    .match-section {
      margin-top: 32px;
    }

    .match-section-title {
      font-family: "Fraunces", serif;

      margin: 0 0 5px;
    }

    .match-section-description {
      color: var(--ink-soft);
      font-size: 13px;
      margin: 0 0 14px;
    }

    .match-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 12px;
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

    }

    .match-name {

      color: var(--ink-soft);

    }

      flex-wrap: wrap;

      margin-top: 14px;

      justify-content: flex-end;

      color: var(--ink);
      border-radius: 6px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 12px;
    }

    .save-match-btn:hover {
      background: var(--accent-bg);
    }

    .empty-state,
    .login-gate {
      text-align: center;
      padding: 48px 24px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: var(--surface);
      margin-top: 24px;
    }

    @media (max-width: 650px) {
      .match-summary {
        grid-template-columns: 1fr;
      }

      .match-top {
        flex-direction: column;
      }

      .match-score {
        text-align: left;
      }
    }
  </style>
</head>

<body>

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="wordmark">CapItNJ</a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="improve.html">Improve</a>
      <a href="explore.html">Explore</a>
      <a href="matches.html" class="active">Matches</a>
      <a href="mylist.html">My List</a>
      <a href="profile.html">Profile</a>
      <a href="support.html">Support</a>
    </div>
  </div>
</header>

<main>
  <div class="wrap">

    <p class="eyebrow">Your matches</p>
    <h1>Colleges ranked for you</h1>
    <p class="subtitle">
      We compare your saved profile with each college's available information.
    </p>

    <div id="matches-content">
      <div class="empty-state">
        Loading your profile and finding matches...
      </div>
    </div>

  </div>
</main>


<!-- Firebase: exact compat order -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script src="firebase-init.js"></script>

<!-- College database -->
<script src="data.js"></script>

<script>
let currentUser = null;
let currentProfile = null;

/* -----------------------------------------
   HELPERS
----------------------------------------- */

function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value ?? "";
  return div.innerHTML;
}

function formatCurrency(value) {
  const number = Number(value);

  if (!Number.isFinite(number)) return "N/A";

  return "$" + Math.round(number).toLocaleString();
}

function getCollegeList() {
  /*
    Handles a few common data.js variable names.
    Your current data.js is expected to expose one of these.
  */
  if (typeof colleges !== "undefined" && Array.isArray(colleges)) {
    return colleges;
  }

  if (typeof collegeData !== "undefined" && Array.isArray(collegeData)) {
    return collegeData;
  }

  if (typeof schools !== "undefined" && Array.isArray(schools)) {
    return schools;
  }

  if (typeof window.colleges !== "undefined" && Array.isArray(window.colleges)) {
    return window.colleges;
  }

  return [];
}

function getNumber(object, keys) {
  for (const key of keys) {
    const value = object[key];

    if (
      value !== undefined &&
      value !== null &&
      value !== "" &&
      Number.isFinite(Number(value))
    ) {
      return Number(value);
    }
  }

  return null;
}

function normalizeText(value) {
  return String(value || "")
    .trim()
    .toLowerCase();
}

function locationMatches(profile, college) {
  const preferred = normalizeText(profile.preferredLocation);

  if (!preferred) return null;

  const state = normalizeText(college.state);
  const country = normalizeText(college.country);
  const location = normalizeText(
    `${college.city || ""} ${college.state || ""} ${college.country || ""}`
  );

  if (preferred === state) return true;
  if (preferred === country) return true;
  if (location.includes(preferred)) return true;

  /*
    Handles values such as:
    "New Jersey"
    "NJ"
    "Northeast"
    "Anywhere"
  */
  if (preferred === "anywhere" || preferred === "any location") {
    return true;
  }

  if (
    (preferred === "nj" || preferred === "new jersey") &&
    (state === "nj" || state === "new jersey")
  ) {
    return true;
  }

  return false;
}


/* -----------------------------------------
   MATCH SCORING
----------------------------------------- */

function calculateMatch(profile, college) {
  let score = 0;
  let possible = 0;
  const reasons = [];

  const budget = Number(profile.budget);
  const gpa = Number(profile.gpa);
  const sat = Number(profile.sat);
  const act = Number(profile.act);

  /*
    Supports several possible college data field names.
  */
  const price = getNumber(college, [
    "netPrice",
    "net_price",
    "tuition",
    "cost",
    "price",
    "avgCost",
    "averageCost",
    "maxTuition"
  ]);

  const collegeGpa = getNumber(college, [
    "gpa",
    "avgGpa",
    "averageGpa",
    "minGpa",
    "recommendedGpa"
  ]);

  const collegeSat = getNumber(college, [
    "sat",
    "avgSat",
    "averageSat",
    "satAverage",
    "satMin"
  ]);

  const collegeAct = getNumber(college, [
    "act",
    "avgAct",
    "averageAct",
    "actAverage",
    "actMin"
  ]);

  /*
    BUDGET
  */
  if (Number.isFinite(budget) && budget > 0 && price !== null) {
    possible += 30;

    if (price <= budget) {
      score += 30;
      reasons.push("Within your budget");
    } else if (price <= budget * 1.15) {
      score += 20;
      reasons.push("Slightly above your budget");
    } else if (price <= budget * 1.35) {
      score += 8;
      reasons.push("Above your budget");
    }
  }

  /*
    GPA
  */
  if (Number.isFinite(gpa) && gpa > 0 && collegeGpa !== null) {
    possible += 25;

    if (gpa >= collegeGpa + 0.25) {
      score += 25;
      reasons.push("GPA is above this school's typical range");
    } else if (gpa >= collegeGpa) {
      score += 22;
      reasons.push("GPA fits this school's typical range");
    } else if (gpa >= collegeGpa - 0.25) {
      score += 14;
      reasons.push("GPA is close to this school's typical range");
    } else {
      score += 4;
      reasons.push("GPA makes this more of a reach");
    }
  }

  /*
    SAT
  */
  if (Number.isFinite(sat) && sat > 0 && collegeSat !== null) {
    possible += 20;

    if (sat >= collegeSat + 80) {
      score += 20;
      reasons.push("SAT is above the school's typical score");
    } else if (sat >= collegeSat) {
      score += 18;
      reasons.push("SAT fits the school's typical score");
    } else if (sat >= collegeSat - 80) {
      score += 11;
      reasons.push("SAT is close to the school's typical score");
    } else {
      score += 3;
      reasons.push("SAT makes this more competitive");
    }
  }

  /*
    ACT
  */
  if (Number.isFinite(act) && act > 0 && collegeAct !== null) {
    possible += 15;

    if (act >= collegeAct + 2) {
      score += 15;
      reasons.push("ACT is above the school's typical score");
    } else if (act >= collegeAct) {
      score += 13;
      reasons.push("ACT fits the school's typical score");
    } else if (act >= collegeAct - 2) {
      score += 8;
      reasons.push("ACT is close to the school's typical score");
    } else {
      score += 2;
      reasons.push("ACT makes this more competitive");
    }
  }

  /*
    LOCATION
  */
  const locationFit = locationMatches(profile, college);

  if (locationFit !== null) {
    possible += 10;

    if (locationFit) {
      score += 10;
      reasons.push("Matches your location preference");
    }
  }

  /*
    If the database does not contain score/price fields,
    don't punish the student by treating missing data as a zero.
  */
  const percentage =
    possible > 0
      ? Math.round((score / possible) * 100)
      : 50;

  return {
    score: Math.max(0, Math.min(100, percentage)),
    reasons: reasons
  };
}


/* -----------------------------------------
   LOAD PROFILE + MATCHES
----------------------------------------- */

function startMatches() {
  const fb = window.capitnjFirebase;
  const container = document.getElementById("matches-content");

  if (!fb) {
    container.innerHTML = `
      <div class="empty-state">
        Firebase couldn't initialize. Refresh the page and try again.
      </div>
    `;
    return;
  }

  fb.authFns.onAuthStateChanged(async (user) => {
    if (!user) {
      container.innerHTML = `
        <div class="login-gate">
          <h2>Log in to get your matches</h2>
          <p>
            Your GPA, test scores, budget, and location preferences are used
            to personalize this page.
          </p>
          <a href="login.html" class="btn">Log in</a>
        </div>
      `;
      return;
    }

    currentUser = user;

    try {
      const profileRef = fb.db
        .collection("users")
        .doc(user.uid);

      const profileSnap = await profileRef.get();

      if (!profileSnap.exists) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>Finish your profile first</h2>
            <p>
              Add your academic and preference information so we can rank
              colleges for you.
            </p>
            <a href="profile.html" class="btn">Complete profile</a>
          </div>
        `;
        return;
      }

      currentProfile = profileSnap.data();

      const hasProfileData =
        currentProfile.gpa ||
        currentProfile.sat ||
        currentProfile.act ||
        currentProfile.budget ||
        currentProfile.preferredLocation;

      if (!hasProfileData) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>Your profile needs a few details</h2>
            <p>
              Add your GPA, budget, test scores, or location preference
              to get personalized matches.
            </p>
            <a href="profile.html" class="btn">Edit profile</a>
          </div>
        `;
        return;
      }

      renderMatches();

    } catch (error) {
      console.error("Error loading profile for matches:", error);

      container.innerHTML = `
        <div class="empty-state">
          <h2>Couldn't load your profile</h2>
          <p>Please refresh and try again.</p>
        </div>
      `;
    }
  });
}


/* -----------------------------------------
   RENDER MATCHES
----------------------------------------- */

function renderMatches() {
  const container = document.getElementById("matches-content");
  const collegeList = getCollegeList();

  if (!collegeList.length) {
    console.error(
      "No college array found. Check the variable exported by data.js."
    );

    container.innerHTML = `
      <div class="empty-state">
        <h2>College data couldn't load</h2>
        <p>Check that data.js loads correctly before Matches.</p>
      </div>
    `;
    return;
  }

  const matched = collegeList
    .map((college) => {
      const match = calculateMatch(currentProfile, college);

      return {
        ...college,
        matchScore: match.score,
        reasons: match.reasons
      };
    })
    .sort((a, b) => b.matchScore - a.matchScore);

  const strongMatches = matched
    .filter(college => college.matchScore >= 75)
    .slice(0, 20);

  const possibleMatches = matched
    .filter(college =>
      college.matchScore >= 50 &&
      college.matchScore < 75
    )
    .slice(0, 20);

  const reachMatches = matched
    .filter(college => college.matchScore < 50)
    .slice(0, 20);

  const profilePills = [];

  if (currentProfile.gpa) {
    profilePills.push(
      `<span class="profile-pill">GPA: ${escapeHtml(currentProfile.gpa)}</span>`
    );
  }

  if (currentProfile.sat) {
    profilePills.push(
      `<span class="profile-pill">SAT: ${escapeHtml(currentProfile.sat)}</span>`
    );
  }

  if (currentProfile.act) {
    profilePills.push(
      `<span class="profile-pill">ACT: ${escapeHtml(currentProfile.act)}</span>`
    );
  }

  if (currentProfile.budget) {
    profilePills.push(
      `<span class="profile-pill">Budget: ${formatCurrency(currentProfile.budget)}</span>`
    );
  }

  if (currentProfile.preferredLocation) {
    profilePills.push(
      `<span class="profile-pill">Location: ${escapeHtml(currentProfile.preferredLocation)}</span>`
    );
  }

  container.innerHTML = `
    <div class="profile-used">
      ${profilePills.join("")}
    </div>

    <div class="match-summary">
      <div class="summary-card">
        <div class="summary-number">${strongMatches.length}</div>
        <div class="summary-label">Strong matches</div>
      </div>

      <div class="summary-card">
        <div class="summary-number">${possibleMatches.length}</div>
        <div class="summary-label">Possible matches</div>
      </div>

      <div class="summary-card">
        <div class="summary-number">${reachMatches.length}</div>
        <div class="summary-label">Reach matches</div>
      </div>
    </div>

    ${renderGroup(
      "Strong matches",
      "The highest-scoring fits based on the information available.",
      strongMatches
    )}

    ${renderGroup(
      "Possible matches",
      "Schools that fit some of your profile factors well.",
      possibleMatches
    )}

    ${renderGroup(
      "Reach matches",
      "These may be more competitive or less aligned with your preferences.",
      reachMatches
    )}
  `;

  document.querySelectorAll(".save-match-btn").forEach((button) => {
    button.addEventListener("click", () => {
      const index = Number(button.dataset.index);
      saveMatch(matched[index], button);
    });
  });
}


function renderGroup(title, description, collegesInGroup) {
  if (!collegesInGroup.length) return "";

  return `
    <section class="match-section">
      <h2 class="match-section-title">${title}</h2>
      <p class="match-section-description">${description}</p>

      ${collegesInGroup.map((college) => {
        const originalIndex = getCollegeList().findIndex(
          item => item.name === college.name
        );

        return `
          <article class="match-card">

            <div class="match-top">
              <div>
                <div class="match-name">
                  ${escapeHtml(college.name || "Unnamed college")}
                </div>

                <div class="match-location">
                  ${escapeHtml(
                    [college.city, college.state, college.country]
                      .filter(Boolean)
                      .join(", ") || "Location unavailable"
                  )}
                </div>
              </div>

              <div class="match-score">
                <div class="match-score-number">
                  ${college.matchScore}%
                </div>
                <div class="match-score-label">Match score</div>
              </div>
            </div>

            ${
              college.reasons.length
                ? `
                  <div class="match-reasons">
                    ${college.reasons
                      .map(reason =>
                        `<span class="reason">${escapeHtml(reason)}</span>`
                      )
                      .join("")}
                  </div>
                `
                : ""
            }

            <div class="match-data">
              ${
                getNumber(college, ["netPrice", "net_price", "tuition", "cost", "price", "avgCost", "averageCost", "maxTuition"]) !== null
                  ? `<span>Cost: ${formatCurrency(getNumber(college, ["netPrice", "net_price", "tuition", "cost", "price", "avgCost", "averageCost", "maxTuition"]))}</span>`
                  : ""
              }

              ${
                getNumber(college, ["avgSat", "averageSat", "sat", "satAverage"]) !== null
                  ? `<span>Typical SAT: ${getNumber(college, ["avgSat", "averageSat", "sat", "satAverage"])}</span>`
                  : ""
              }

              ${
                getNumber(college, ["avgAct", "averageAct", "act", "actAverage"]) !== null
                  ? `<span>Typical ACT: ${getNumber(college, ["avgAct", "averageAct", "act", "actAverage"])}</span>`
                  : ""
              }
            </div>

            <div class="match-actions">
              <button
                class="save-match-btn"
                data-index="${originalIndex}">
                Save to My List
              </button>
            </div>

          </article>
        `;
      }).join("")}

    </section>
  `;
}


/* -----------------------------------------
   SAVE TO FIRESTORE
----------------------------------------- */

async function saveMatch(college, button) {
  if (!currentUser || !college) return;

  const fb = window.capitnjFirebase;

  try {
    button.disabled = true;
    button.textContent = "Saving...";

    await fb.firestoreFns.addDoc(
      fb.firestoreFns.collection(
        fb.db,
        "users",
        currentUser.uid,
        "savedColleges"
      ),
      {
        name: college.name || "",
        state: college.state || "",
        country: college.country || "",
        rate: college.rate || college.acceptanceRate || "N/A",
        priority: "Considering",
        source: "Matches",
        timestamp: new Date().toISOString()
      }
    );

    button.textContent = "Saved ✓";

  } catch (error) {
    console.error("Error saving match:", error);
    button.disabled = false;
    button.textContent = "Try again";
  }
}


/* -----------------------------------------
   START
----------------------------------------- */

if (window.capitnjFirebase) {
  startMatches();
} else {
  window.addEventListener("firebase-ready", startMatches, { once: true });
}
</script>
