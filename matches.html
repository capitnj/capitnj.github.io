<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapItNJ — Matches</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
        /* fallback so this page doesn't become ugly/default-looking */
        :root {
            --ink: #172033;
            --ink-soft: #657084;
            --ink-faint: #8d96a5;
            --bg: #f8f8f6;
            --surface: #ffffff;
            --line: #e2e4e8;
            --accent: #1e3a8a;
            --accent-bg: #eef2ff;
            --max-w: 1100px;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--ink);
        }

        .nav {
            background: var(--surface);
            border-bottom: 1px solid var(--line);
        }

        .nav-inner {
            max-width: var(--max-w);
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .wordmark {
            color: var(--ink);
            text-decoration: none;
            font-family: 'Fraunces', serif;
            font-size: 22px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--ink-soft);
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a.active,
        .nav-links a:hover {
            color: var(--accent);
        }

        main {
            min-height: calc(100vh - 70px);
        }

        .wrap {
            max-width: var(--max-w);
            margin: 0 auto;
            padding: 48px 24px;
        }

        .eyebrow {
            color: var(--accent);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-weight: 500;
            margin: 0 0 12px;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-size: 42px;
            margin: 0 0 12px;
        }

        .subtitle {
            color: var(--ink-soft);
            max-width: 700px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .empty-state,
        .login-gate {
            text-align: center;
            padding: 45px 24px;
            border: 1px dashed var(--line);
            background: var(--surface);
            border-radius: 8px;
        }

        .empty-state a,
        .login-gate a {
            color: var(--accent);
        }

        .btn {
            display: inline-block;
            background: var(--accent);
            color: white !important;
            padding: 10px 16px;
            border-radius: 4px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
        }

        .match-card {
            background: var(--surface);
            border: 1px solid var(--line);
            padding: 20px;
            margin-bottom: 12px;
        }

        .match-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .college-name {
            font-size: 18px;
            font-weight: 600;
        }

        .college-meta {
            color: var(--ink-soft);
            font-size: 13px;
            margin-top: 5px;
        }

        .match-score {
            text-align: right;
            flex-shrink: 0;
        }

        .match-score strong {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 20px;
        }

        .match-score span {
            display: block;
            color: var(--ink-faint);
            font-size: 10px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .match-reasons {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 15px;
        }

        .match-reason {
            background: var(--accent-bg);
            color: var(--accent);
            font-size: 12px;
            padding: 5px 9px;
            border-radius: 3px;
        }

        .match-details {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 15px;
            padding-top: 13px;
            border-top: 1px solid var(--line);
            font-size: 12px;
            color: var(--ink-soft);
        }

        .match-actions {
            margin-top: 15px;
            display: flex;
            justify-content: flex-end;
        }

        .save-btn {
            background: #22A84A;
            color: white;
            border: 1px solid #22A84A;
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 3px;
            cursor: pointer;
        }

        .save-btn:disabled {
            opacity: .65;
            cursor: default;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--line);
        }

        .filter-btn {
            border: 1px solid var(--line);
            background: white;
            color: var(--ink);
            padding: 9px 14px;
            border-radius: 2px;
            font-size: 13px;
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .summary {
            font-family: 'IBM Plex Mono', monospace;
            color: var(--ink-soft);
            font-size: 12px;
            margin-bottom: 22px;
        }

        @media (max-width: 700px) {
            .nav-inner {
                flex-direction: column;
                align-items: flex-start;
            }

            .match-card-top {
                flex-direction: column;
            }

            .match-score {
                text-align: left;
            }

            h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<header class="nav">
    <div class="nav-inner">
        <a href="index.html" class="wordmark">CapItNJ</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="improve.html">Improve</a>
            <a href="explore.html">Explore</a>
            <a href="matches.html" class="active">Matches</a>
            <a href="mylist.html">My List</a>
            <a href="profile.html">Profile</a>
            <a href="support.html">Support</a>
        </div>
    </div>
</header>

<main>
    <div class="wrap">

        <p class="eyebrow">Your matches</p>
        <h1>Ranked for you</h1>
        <p class="subtitle">
            Colleges matched using your saved profile, including your GPA,
            budget, location preferences, and available college information.
        </p>

        <div id="matches-content">
            <div class="empty-state">
                Loading your profile and matches...
            </div>
        </div>

    </div>
</main>


<!-- Firebase compat scripts -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script src="firebase-init.js"></script>
<script src="data.js"></script>

<script>
    let currentUser = null;
    let userProfile = null;
    let allMatches = [];
    let currentFilter = "all";


    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value == null ? "" : value;
        return div.innerHTML;
    }


    function getColleges() {
        /*
         * YOUR project uses collegesData.
         * These fallbacks are here in case another version uses a different name.
         */
        if (typeof collegesData !== "undefined" && Array.isArray(collegesData)) {
            return collegesData;
        }

        if (window.collegesData && Array.isArray(window.collegesData)) {
            return window.collegesData;
        }

        if (window.COLLEGES && Array.isArray(window.COLLEGES)) {
            return window.COLLEGES;
        }

        return [];
    }


    function formatMoney(value) {
        const number = Number(value);

        if (!Number.isFinite(number) || number <= 0) {
            return "N/A";
        }

        return "$" + Math.round(number).toLocaleString();
    }


    function normalize(value) {
        return String(value || "")
            .trim()
            .toLowerCase();
    }


    function getProfileBudget(profile) {
        return Number(
            profile.budget ||
            profile.maxTuition ||
            profile.maxBudget ||
            0
        );
    }


    function getCollegeGPA(college) {
        return Number(
            college.avgGPA ||
            college.avgGpa ||
            college.gpa ||
            0
        );
    }


    function getCollegePrice(college) {
        return Number(
            college.netPrice ||
            college.tuition ||
            college.cost ||
            0
        );
    }


    function locationFits(profile, college) {
        const preference = normalize(
            profile.preferredLocation ||
            profile.location ||
            profile.state
        );

        if (!preference || preference === "flexible" || preference === "anywhere") {
            return null;
        }

        const collegeState = normalize(college.state);
        const collegeCountry = normalize(college.country);

        if (preference === collegeState) return true;

        if (
            (preference === "new jersey" || preference === "nj") &&
            (collegeState === "new jersey" || collegeState === "nj")
        ) {
            return true;
        }

        if (preference === collegeCountry) return true;

        return false;
    }


    function calculateMatch(profile, college) {
        let score = 50;
        const reasons = [];

        const studentGPA = Number(profile.gpa || 0);
        const collegeGPA = getCollegeGPA(college);

        const budget = getProfileBudget(profile);
        const price = getCollegePrice(college);

        /*
         * GPA matching
         */
        if (studentGPA > 0 && collegeGPA > 0) {
            const gap = studentGPA - collegeGPA;

            if (gap >= 0.5) {
                score += 25;
                reasons.push("Your GPA is well above this school's typical range");
            } else if (gap >= 0) {
                score += 20;
                reasons.push("Your GPA is a strong fit");
            } else if (gap >= -0.25) {
                score += 12;
                reasons.push("Your GPA is close to this school's range");
            } else if (gap >= -0.5) {
                score += 3;
                reasons.push("This is a competitive GPA match");
            } else {
                score -= 18;
                reasons.push("Your GPA makes this more of a reach");
            }
        }

        /*
         * Budget matching
         */
        if (budget > 0 && price > 0) {
            if (price <= budget * 0.8) {
                score += 20;
                reasons.push("Comfortably within your budget");
            } else if (price <= budget) {
                score += 15;
                reasons.push("Fits within your budget");
            } else if (price <= budget * 1.15) {
                score += 5;
                reasons.push("Slightly above your budget");
            } else {
                score -= 15;
                reasons.push("Above your budget");
            }
        }

        /*
         * Location preference
         */
        const locationMatch = locationFits(profile, college);

        if (locationMatch === true) {
            score += 10;
            reasons.push("Matches your location preference");
        } else if (locationMatch === false) {
            score -= 3;
        }

        score = Math.max(1, Math.min(99, Math.round(score)));

        let category;

        if (score < 45) {
            category = "reach";
        } else if (score >= 75) {
            category = "safety";
        } else {
            category = "match";
        }

        return {
            score: score,
            category: category,
            reasons: reasons
        };
    }


    function buildMatches() {
        const colleges = getColleges();

        if (!colleges.length) {
            console.error("No colleges found. Expected collegesData in data.js.");

            document.getElementById("matches-content").innerHTML = `
                <div class="empty-state">
                    <h2>College data isn't available yet</h2>
                    <p>We couldn't find the college list from data.js.</p>
                </div>
            `;

            return;
        }

        allMatches = colleges.map(college => {
            const result = calculateMatch(userProfile, college);

            return {
                ...college,
                matchScore: result.score,
                category: result.category,
                reasons: result.reasons
            };
        });

        /*
         * Highest fit first
         */
        allMatches.sort((a, b) => b.matchScore - a.matchScore);

        renderPage();
    }


    function categoryColor(category) {
        if (category === "reach") return "#FF8B5A";
        if (category === "safety") return "#4DABF7";
        return "#51CF66";
    }


    function renderPage() {
        const budget = getProfileBudget(userProfile);

        const profileText = [];

        if (userProfile.gpa) {
            profileText.push("GPA " + userProfile.gpa);
        }

        if (budget) {
            profileText.push("Budget " + formatMoney(budget) + "/yr");
        }

        if (userProfile.preferredLocation) {
            profileText.push(userProfile.preferredLocation);
        }

        document.getElementById("matches-content").innerHTML = `
            <div class="summary">
                ${escapeHtml(
                    profileText.length
                        ? profileText.join(" · ")
                        : "Using your saved profile"
                )}
            </div>

            <div class="filter-bar">
                <button class="filter-btn active" id="filter-all">
                    All Matches
                </button>

                <button class="filter-btn" id="filter-reach">
                    Reach
                </button>

                <button class="filter-btn" id="filter-match">
                    Match
                </button>

                <button class="filter-btn" id="filter-safety">
                    Safety
                </button>
            </div>

            <section id="matches-container"></section>
        `;

        document.getElementById("filter-all").onclick = () => setFilter("all");
        document.getElementById("filter-reach").onclick = () => setFilter("reach");
        document.getElementById("filter-match").onclick = () => setFilter("match");
        document.getElementById("filter-safety").onclick = () => setFilter("safety");

        renderMatches();
    }


    function setFilter(filter) {
        currentFilter = filter;

        document.querySelectorAll(".filter-btn").forEach(button => {
            button.classList.remove("active");
        });

        const activeButton = document.getElementById("filter-" + filter);

        if (activeButton) {
            activeButton.classList.add("active");
        }

        renderMatches();
    }


    function renderMatches() {
        const container = document.getElementById("matches-container");

        let matches = allMatches;

        if (currentFilter !== "all") {
            matches = allMatches.filter(
                college => college.category === currentFilter
            );
        }

        if (!matches.length) {
            container.innerHTML = `
                <div class="empty-state">
                    No matches in this category yet.
                </div>
            `;
            return;
        }

        container.innerHTML = matches.map(college => {
            const badgeColor = categoryColor(college.category);
            const price = getCollegePrice(college);

            return `
                <article class="match-card">

                    <div class="match-card-top">

                        <div>
                            <div class="college-name">
                                ${escapeHtml(college.name)}
                            </div>

                            <div class="college-meta">
                                ${escapeHtml(
                                    [
                                        college.type || "University",
                                        college.city,
                                        college.state,
                                        college.country
                                    ]
                                    .filter(Boolean)
                                    .join(" · ")
                                )}
                            </div>
                        </div>

                        <div class="match-score">
                            <strong>${college.matchScore}%</strong>
                            <span>profile fit</span>
                        </div>

                    </div>

                    <div class="match-reasons">
                        <span
                            class="match-reason"
                            style="background:${badgeColor}; color:white;"
                        >
                            ${escapeHtml(college.category.toUpperCase())}
                        </span>

                        ${
                            college.reasons.length
                                ? college.reasons.map(reason => `
                                    <span class="match-reason">
                                        ${escapeHtml(reason)}
                                    </span>
                                `).join("")
                                : `
                                    <span class="match-reason">
                                        General profile match
                                    </span>
                                `
                        }
                    </div>

                    <div class="match-details">
                        <span>
                            Typical GPA:
                            ${college.avgGPA || college.avgGpa || "N/A"}
                        </span>

                        <span>
                            Est. cost:
                            ${formatMoney(price)}
                        </span>

                        ${
                            college.state
                                ? `<span>${escapeHtml(college.state)}</span>`
                                : ""
                        }
                    </div>

                    <div class="match-actions">
                        <button
                            class="save-btn"
                            data-id="${escapeHtml(college.id || college.name)}"
                            data-name="${encodeURIComponent(college.name || "")}"
                        >
                            Save
                        </button>
                    </div>

                </article>
            `;
        }).join("");

        document.querySelectorAll(".save-btn").forEach(button => {
            button.addEventListener("click", () => {
                const college = allMatches.find(item =>
                    String(item.id || item.name) === button.dataset.id
                );

                saveCollege(college, button);
            });
        });
    }


    async function saveCollege(college, button) {
        if (!college || !currentUser) return;

        try {
            button.disabled = true;
            button.textContent = "Saving...";

            const fb = window.capitnjFirebase;

            /*
             * Use the SAME localStorage list structure as Explore/My List.
             */
            let saved = JSON.parse(
                localStorage.getItem("savedColleges") || "[]"
            );

            const alreadySaved = saved.some(
                item => String(item.id) === String(college.id)
            );

            if (!alreadySaved) {
                saved.push({
                    id: college.id,
                    name: college.name
                });

                localStorage.setItem(
                    "savedColleges",
                    JSON.stringify(saved)
                );
            }

            /*
             * Also save to Firebase.
             */
            const uid = String(college.id || college.name)
                .replace(/[\/.#$[\]]/g, "_");

            const docRef = fb.firestoreFns.doc(
                fb.db,
                "users",
                currentUser.uid,
                "savedColleges",
                uid
            );

            await fb.firestoreFns.setDoc(docRef, {
                id: college.id || "",
                name: college.name || "",
                state: college.state || "",
                priority: "Considering",
                source: "Matches",
                timestamp: new Date().toISOString()
            });

            button.textContent = "Saved ✓";

        } catch (error) {
            console.error("Error saving college:", error);
            button.disabled = false;
            button.textContent = "Save";
        }
    }


    async function loadUserProfile(user) {
        const fb = window.capitnjFirebase;

        currentUser = user;

        try {
            const profileRef = fb.firestoreFns.doc(
                fb.db,
                "users",
                user.uid
            );

            const profileSnap = await fb.firestoreFns.getDoc(profileRef);

            if (!profileSnap.exists()) {
                document.getElementById("matches-content").innerHTML = `
                    <div class="empty-state">
                        <h2>Finish your profile first</h2>
                        <p>
                            Add your GPA and preferences so we can find
                            colleges that fit you.
                        </p>
                        <a href="profile.html">Go to Profile</a>
                    </div>
                `;
                return;
            }

            userProfile = profileSnap.data();

            /*
             * Keep localStorage updated too because My List
             * currently uses it.
             */
            localStorage.setItem(
                "userProfile",
                JSON.stringify(userProfile)
            );

            buildMatches();

        } catch (error) {
            console.error("Could not load profile:", error);

            document.getElementById("matches-content").innerHTML = `
                <div class="empty-state">
                    <h2>We couldn't load your profile</h2>
                    <p>Please refresh and try again.</p>
                </div>
            `;
        }
    }


    function startMatches() {
        const fb = window.capitnjFirebase;

        if (!fb) {
            window.addEventListener(
                "firebase-ready",
                startMatches,
                { once: true }
            );
            return;
        }

        /*
         * IMPORTANT:
         * Your firebase-init.js defines this as
         * onAuthStateChanged(callback)
         *
         * so we pass ONLY the callback.
         */
        fb.authFns.onAuthStateChanged(async user => {
            if (!user) {
                document.getElementById("matches-content").innerHTML = `
                    <div class="login-gate">
                        <h2>Log in to get your matches</h2>
                        <p>
                            Your saved profile is used to personalize
                            your college matches.
                        </p>
                        <a href="login.html" class="btn">
                            Log in
                        </a>
                    </div>
                `;

                return;
            }

            await loadUserProfile(user);
        });
    }


    startMatches();
</script>

</body>
</html>
