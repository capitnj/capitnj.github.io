<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ask Capi | CapItNJ</title>

    <link rel="stylesheet" href="style.css">

    <style>
        

        body {
            background: var(--bg);
            overflow: hidden;
        }

        

        .nav {
            position: relative;
            z-index: 10;
        }

        .nav-links a.active {
            color: var(--accent);
        }

        

        .capi-app {
            height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        

        .capi-chat {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .capi-chat-inner {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 55px 28px 150px;
        }

        

        .capi-welcome {
            min-height: 430px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .capi-mark {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: var(--accent);
            color: #fff;

            font-family: var(--font-display);
            font-size: 23px;
            font-weight: 600;

            margin-bottom: 20px;

            box-shadow:
                0 8px 24px rgba(30, 58, 95, 0.14);
        }

        .capi-welcome h1 {
            margin: 0;

            font-family: var(--font-display);
            font-size: 38px;
            font-weight: 600;

            letter-spacing: -0.035em;
            line-height: 1.05;

            color: var(--ink);
        }

        .capi-welcome h1 em {
            color: var(--accent-light);
            font-style: italic;
        }

        .capi-welcome p {
            max-width: 520px;

            margin: 14px auto 0;

            color: var(--ink-soft);

            font-size: 14px;
            line-height: 1.65;
        }

        

        #chatMessages {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .message {
            width: 100%;
            display: flex;

            animation: messageIn 0.2s ease both;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            font-family: var(--font-body);
            font-size: 14px;
            line-height: 1.7;

            white-space: pre-wrap;
        }

        /* AI */

        .ai .bubble {
            max-width: 720px;
            color: var(--ink);
        }

        .capi-label {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 8px;

            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.07em;
            text-transform: uppercase;

            color: var(--accent);
        }

        .capi-label-line {
            width: 17px;
            height: 1px;
            background: var(--accent-light);
        }

        /* USER */

        .user .bubble {
            max-width: 650px;

            padding: 11px 16px;

            background: var(--accent);
            color: #fff;

            border-radius: 15px 15px 4px 15px;

            box-shadow:
                0 5px 14px rgba(30, 58, 95, 0.12);
        }

        

        .capi-suggestions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;

            gap: 8px;

            margin: 0 auto 18px;

            max-width: 850px;
            padding: 0 28px;
        }

        .suggestion {
            border: 1px solid var(--line);

            background: var(--bg);
            color: var(--ink-soft);

            border-radius: 999px;

            padding: 9px 14px;

            font-family: var(--font-body);
            font-size: 12px;

            cursor: pointer;

            transition:
                background 0.18s ease,
                border-color 0.18s ease,
                color 0.18s ease,
                transform 0.18s ease;
        }

        .suggestion:hover {
            background: var(--accent-bg);
            border-color: var(--accent-light);
            color: var(--accent);

            transform: translateY(-1px);
        }

        

        .capi-bottom {
            position: relative;

            width: 100%;

            padding: 0 20px 20px;

            background: linear-gradient(
                to bottom,
                transparent,
                var(--bg) 18%
            );
        }

        .capi-composer-wrap {
            width: 100%;
            max-width: 850px;

            margin: 0 auto;
        }

        .capi-composer {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 10px;

            padding: 7px 7px 7px 18px;

            background: var(--bg);

            border: 1px solid var(--line);
            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(11, 18, 32, 0.07);

            transition:
                border-color 0.18s ease,
                box-shadow 0.18s ease;
        }

        .capi-composer:focus-within {
            border-color: var(--accent-light);

            box-shadow:
                0 0 0 4px var(--accent-bg),
                0 8px 30px rgba(11, 18, 32, 0.07);
        }

        #questionInput {
            flex: 1;
            min-width: 0;

            height: 44px;

            border: none;
            outline: none;

            background: transparent;
            color: var(--ink);

            font-family: var(--font-body);
            font-size: 14px;
        }

        #questionInput::placeholder {
            color: var(--ink-faint);
        }

        #sendButton {
            width: 78px;
            height: 42px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 11px;

            background: var(--accent);
            color: #fff;

            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;

            cursor: pointer;

            transition:
                background 0.18s ease,
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        #sendButton:hover:not(:disabled) {
            background: #162F4D;

            transform: translateY(-1px);

            box-shadow:
                0 5px 14px rgba(30, 58, 95, 0.18);
        }

        #sendButton:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        

        .capi-note {
            margin: 8px 0 0;

            text-align: center;

            color: var(--ink-faint);

            font-size: 10px;
        }

      

        .dot-loader {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 4px;
        }

        .dot-loader span {
            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: var(--accent-light);

            animation: dotPulse 1.15s infinite ease-in-out;
        }

        .dot-loader span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .dot-loader span:nth-child(3) {
            animation-delay: 0.3s;
        }

        

        @keyframes dotPulse {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.3;
            }

            30% {
                transform: translateY(-3px);
                opacity: 1;
            }
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        

        @media (max-width: 760px) {

            body {
                overflow: hidden;
            }

            .capi-app {
                height: calc(100vh - 64px);
            }

            .capi-chat-inner {
                padding:
                    30px
                    16px
                    130px;
            }

            .capi-welcome {
                min-height: 380px;
            }

            .capi-welcome h1 {
                font-size: 32px;
            }

            .capi-welcome p {
                font-size: 13px;
            }

            .capi-suggestions {
                justify-content: flex-start;

                overflow-x: auto;
                flex-wrap: nowrap;

                scrollbar-width: none;

                padding:
                    0
                    16px;

                margin-bottom: 14px;
            }

            .capi-suggestions::-webkit-scrollbar {
                display: none;
            }

            .suggestion {
                flex-shrink: 0;
                white-space: nowrap;
            }

            .capi-bottom {
                padding:
                    0
                    12px
                    14px;
            }

            .capi-composer {
                border-radius: 14px;
                padding-left: 14px;
            }

            #sendButton {
                width: 70px;
            }

            .user .bubble {
                max-width: 84%;
            }
        }

        @media (max-width: 480px) {

            .capi-welcome h1 {
                font-size: 29px;
            }

            .capi-mark {
                width: 44px;
                height: 44px;
                font-size: 21px;
            }

            #questionInput {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    

    <header class="nav">
        <div class="nav-inner">

            <a href="index.html" class="wordmark">
                CapItNJ
            </a>

            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="improve.html">
                    Improve
                </a>

                <a href="explore.html">
                    Explore
                </a>

                <a href="matches.html">
                    Matches
                </a>

                <a href="mylist.html">
                    My List
                </a>

                <a href="profile.html">
                    Profile
                </a>

                <a href="askcapi.html" class="active">
                    Ask Capi
                </a>

                <a href="support.html">
                    Support
                </a>

            </div>

        </div>
    </header>


    

    <main class="capi-app">

       

        <div class="capi-chat" id="capiChat">

            <div class="capi-chat-inner">

               

                <div class="capi-welcome" id="capiWelcome">

                    <div class="capi-mark">
                        C
                    </div>

                    <h1>
                        Ask <em>Capi.</em>
                    </h1>

                    <p>
                        Your college questions, without the 47 open tabs.
                        Ask about admissions, GPA, financial aid,
                        scholarships, college lists, and more.
                    </p>

                </div>


               

                <div id="chatMessages"></div>

            </div>

        </div>


        

        <div class="capi-bottom">

            <div class="capi-composer-wrap">

                

                <div class="capi-suggestions">

                    <button
                        class="suggestion"
                        onclick="askSuggestion('What colleges can I get into with my GPA?')">
                        What colleges can I get into?
                    </button>

                    <button
                        class="suggestion"
                        onclick="askSuggestion('What is the difference between a reach, target, and safety school?')">
                        Reach vs target vs safety
                    </button>

                    <button
                        class="suggestion"
                        onclick="askSuggestion('How should I build my college list?')">
                        Help build my college list
                    </button>

                </div>


                

                <div class="capi-composer">

                    <input
                        type="text"
                        id="questionInput"
                        placeholder="Ask Capi anything..."
                        autocomplete="off"
                    >

                    <button id="sendButton">
                        Send
                    </button>

                </div>

                <p class="capi-note">
                    Capi is still developing — responses may take a little time :)
                </p>

            </div>

        </div>

    </main>


    

    <script type="module" src="askcapi.js"></script>

</body>
</html>
