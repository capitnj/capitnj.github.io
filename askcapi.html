<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ask Capi | CapitNJ</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #1f2937;
        }

        .ask-page {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .ask-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .ask-header h1 {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .ask-header p {
            color: #6b7280;
            font-size: 17px;
        }

        .chat-box {
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        #chatMessages {
            height: 480px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 18px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 13px 17px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai .bubble {
            background: #f1f3f7;
            color: #1f2937;
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #e5e7eb;
        }

        #questionInput {
            flex: 1;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
        }

        #sendButton {
            padding: 14px 22px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #1d4ed8;
        }

        #sendButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .suggestions {
            text-align: center;
            margin-bottom: 20px;
        }

        .suggestion {
            display: inline-block;
            margin: 5px;
            padding: 9px 14px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 20px;
            cursor: pointer;
        }

        .suggestion:hover {
            background: #f1f5f9;
        }
    </style>
</head>

<body>

    <main class="ask-page">

        <a href="capitnj.html" class="back-link">← Back to CapitNJ</a>

        <div class="ask-header">
            <h1>Ask Capi ✨</h1>
            <p>Your AI college assistant. Ask me anything about college.</p>
        </div>

        <div class="suggestions">
            <button class="suggestion" onclick="askSuggestion('What colleges can I get into with my GPA?')">
                What colleges can I get into?
            </button>

            <button class="suggestion" onclick="askSuggestion('What is the difference between a reach, target, and safety school?')">
                Reach vs target vs safety?
            </button>

            <button class="suggestion" onclick="askSuggestion('How should I build my college list?')">
                Help build my college list
            </button>
        </div>

        <div class="chat-box">

            <div id="chatMessages">

                <div class="message ai">
                    <div class="bubble">
Hey! I'm Capi ✨

I can help with college admissions, GPA, SAT/ACT questions, college lists, applications, financial aid, and more.

What do you wanna know?
                    </div>
                </div>

            </div>

            <div class="chat-input-area">
                <input
                    type="text"
                    id="questionInput"
                    placeholder="Ask Capi anything..."
                >

                <button id="sendButton">
                    Send
                </button>
            </div>

        </div>

    </main>

    <script type="module" src="askcapi.js"></script>

</body>
</html>
