<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - CapItNJ</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .profile-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 3rem;
            border-bottom: 2px solid #ddd;
            padding-bottom: 2rem;
        }

        .profile-header h1 {
            font-size: 2.5rem;
            margin: 0.5rem 0;
            color: #333;
        }

        .form-section {
            background: white;
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-section h2 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.25);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .status-msg {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 4px;
            text-align: center;
            font-weight: 600;
        }

        .status-msg.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-msg.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        #loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: #666;
        }

        #profile-content {
            display: block;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">CapItNJ</a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
                <li><a href="matches.html">Find Colleges</a></li>
            </ul>
        </div>
    </nav>

    <div id="profile-content">
        <div class="profile-container">
            <div class="profile-header">
                <h1>College Preferences</h1>
                <p>Tell us about what you're looking for in a college</p>
            </div>

            <div class="form-section">
                <h2>Your Information</h2>
                <form id="preferences-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="gpa">GPA</label>
                            <input type="number" id="gpa" step="0.01" min="0" max="4.0" placeholder="3.8">
                        </div>
                        <div class="form-group">
                            <label for="sat">SAT Score</label>
                            <input type="number" id="sat" min="400" max="1600" placeholder="1200">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="preferred-location">Your Zipcode</label>
                            <input type="text" id="preferred-location" placeholder="06510" maxlength="5">
                        </div>
                        <div class="form-group">
                            <label for="search-radius">Search Radius</label>
                            <select id="search-radius">
                                <option value="30">30 miles</option>
                                <option value="50" selected>50 miles</option>
                                <option value="100">100 miles</option>
                                <option value="300">300 miles</option>
                                <option value="999">Anywhere in US</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="max-tuition">Max Annual Tuition ($)</label>
                            <input type="number" id="max-tuition" min="0" step="1000" placeholder="50000">
                        </div>
                        <div class="form-group">
                            <label for="school-type">School Type</label>
                            <select id="school-type">
                                <option value="all">Any</option>
                                <option value="public">Public</option>
                                <option value="private">Private</option>
                            </select>
                        </div>
                    </div>

                    <div class="btn-group">
                        <button type="submit" id="save-btn" class="btn btn-primary">Find Colleges</button>
                    </div>
                    <div id="status-message" class="status-msg" style="display: none;"></div>
                </form>
            </div>
        </div>
    </div>

    <div id="matching-loader" style="display: none; text-align: center; padding: 2rem;">
        <p>Loading colleges...</p>
    </div>

    <script src="data.js"></script>
    <script src="matching.js"></script>
</body>
</html>
