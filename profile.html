<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapItNJ — My Profile</title>
    <!-- Custom styling -->
    <link rel="stylesheet" href="style.css"> 
    <!-- Load modular initialization script first -->
    <script type="module" src="firebase-init.js"></script>
</head>
<body>
    <header>
        <div class="logo">CapItNJ</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="explore.html">Explore</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="matches.html">Matches</a>
            <a href="mylist.html">My List</a>
            <a href="improve.html">Improve</a>
            <button id="logout-btn" style="display:none;">Log Out</button>
        </nav>
    </header>

    <main class="profile-container">
        <h1>Your Profile</h1>
        <div id="loading">Loading your profile data...</div>
        
        <div id="profile-content" style="display: none;">
            <div class="profile-card">
                <h2>Account Details</h2>
                <p><strong>Name:</strong> <span id="user-name">N/A</span></p>
                <p><strong>Email:</strong> <span id="user-email">N/A</span></p>
            </div>

            <div class="profile-card">
                <h2>College Preferences</h2>
                <form id="preferences-form">
                    <label for="max-tuition">Maximum Annual Tuition ($):</label>
                    <input type="number" id="max-tuition" placeholder="e.g., 20000">

                    <label for="preferred-location">Preferred Location:</label>
                    <select id="preferred-location">
                        <option value="any">No Preference</option>
                        <option value="north-nj">North Jersey</option>
                        <option value="central-nj">Central Jersey</option>
                        <option value="south-nj">South Jersey</option>
                        <option value="out-of-state">Out of State</option>
                    </select>

                    <button type="submit">Save Preferences</button>
                </form>
                <p id="status-message" class="status-msg"></p>
            </div>
        </div>
    </main>

    <script type="module">
        // Wait until firebase-init.js assigns window variables
        window.addEventListener('load', () => {
            const { requireAuth, logOut, db, firestoreFns } = window;
            const { doc, getDoc, setDoc } = firestoreFns;

            // Secure the page: Only allow logged-in users
            requireAuth(async (user) => {
                // UI Elements
                const loadingEl = document.getElementById('loading');
                const contentEl = document.getElementById('profile-content');
                const logoutBtn = document.getElementById('logout-btn');
                const nameEl = document.getElementById('user-name');
                const emailEl = document.getElementById('user-email');
                const tuitionInput = document.getElementById('max-tuition');
                const locationSelect = document.getElementById('preferred-location');
                const prefForm = document.getElementById('preferences-form');
                const statusMsg = document.getElementById('status-message');

                // Reveal UI components
                loadingEl.style.display = 'none';
                contentEl.style.display = 'block';
                logoutBtn.style.display = 'inline-block';

                // Display base authentication data
                nameEl.textContent = user.displayName || "CapItNJ User";
                emailEl.textContent = user.email;

                // Bind logout functionality
                logoutBtn.addEventListener('click', logOut);

                // Fetch extra profile data from Firestore
                const userDocRef = doc(db, "users", user.uid);
                try {
                    const docSnap = await getDoc(userDocRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.maxTuition) tuitionInput.value = data.maxTuition;
                        if (data.preferredLocation) locationSelect.value = data.preferredLocation;
                    }
                } catch (error) {
                    console.error("Error fetching profile document:", error);
                }

                // Save updated preferences to Firestore
                prefForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    statusMsg.textContent = "Saving...";
                    statusMsg.className = "status-msg";

                    try {
                        await setDoc(userDocRef, {
                            maxTuition: tuitionInput.value,
                            preferredLocation: locationSelect.value,
                            email: user.email,
                            updatedAt: new Date().toISOString()
                        }, { merge: true });

                        statusMsg.textContent = "Preferences saved successfully!";
                        statusMsg.className = "status-msg success";
                    } catch (error) {
                        console.error("Error saving preferences:", error);
                        statusMsg.textContent = "Failed to save preferences. Try again.";
                        statusMsg.className = "status-msg error";
                    }
                });
            });
        });
    </script>
