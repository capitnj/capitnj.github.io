<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="wordmark">CapItNJ</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="explore.html">Explore</a>
      <a href="profile.html">Profile</a>
      <a href="matches.html">Matches</a>
      <a href="mylist.html">My List</a>
      <a href="improve.html">Improve</a>
    </div>
  </div>
</header>

<main>
  <div class="wrap" style="max-width: 420px; margin: 0 auto; padding: 60px 20px;">
    <h1 id="form-title" style="font-family: 'Fraunces', serif; font-size: 32px; margin-bottom: 6px;">Log in</h1>
    <p id="form-subtitle" style="color: #666; margin-bottom: 24px;">Find colleges you can actually afford.</p>

    <!-- Error container target placeholder explicitly styled for alerts -->
    <p id="error-msg" style="color: #ef4444; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; margin-bottom: 16px; display: none; line-height: 1.4;"></p>

    <form id="login-form">
      <div class="field" style="margin-bottom: 16px;">
        <label for="email-input">Email Address</label>
        <input type="email" id="email-input" placeholder="you@example.com" required style="width: 100%; box-sizing: border-box;">
      </div>
      
      <div class="field" style="margin-bottom: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label for="password-input">Password</label>
          <button type="button" id="open-reset-modal-btn" style="background: none; border: none; color: #666; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 0;">Forgot password?</button>
        </div>
        <input type="password" id="password-input" placeholder="••••••••" required style="width: 100%; box-sizing: border-box;">
      </div>

      <button type="submit" id="submit-btn" class="btn" style="width: 100%; padding: 12px; font-weight: 600;">Log in</button>
    </form>

    <p style="margin-top: 24px; text-align: center; font-size: 14px; color: #555;">
      <span id="toggle-text">Don't have an account?</span> 
      <button type="button" id="toggle-btn" style="background: none; border: none; color: #111; font-weight: 600; cursor: pointer; text-decoration: underline; padding: 0; margin-left: 4px;">Sign up</button>
    </p>
  </div>
</main>

<!-- Initialize and link clean infrastructure scripts -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<script src="firebase-init.js"></script>

<script>
  // Core Operational Authentication Logic Configuration Block
  const auth = firebase.auth();

  const toggleBtn = document.getElementById('toggle-btn');
  const toggleText = document.getElementById('toggle-text');
  const formTitle = document.getElementById('form-title');
  const formSubtitle = document.getElementById('form-subtitle');
  const submitBtn = document.getElementById('submit-btn');
  const errorMsg = document.getElementById('error-msg');
  const emailField = document.getElementById("email-input");
  const passwordField = document.getElementById("password-input");
  const loginForm = document.getElementById("login-form");

  let mode = "login";

  // Check login state and forward automatically if valid session cookies match
  auth.onAuthStateChanged((user) => {
    if (user) {
      window.location.href = "profile.html";
    }
  });

  // Interface Toggle configuration handling
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      mode = mode === "login" ? "signup" : "login";
      if (errorMsg) { errorMsg.style.display = "none"; errorMsg.textContent = ""; }

      if (mode === "signup") {
        if (formTitle) formTitle.textContent = "Create your account";
        if (formSubtitle) formSubtitle.textContent = "Takes less than a minute.";
        if (submitBtn) submitBtn.textContent = "Sign up";
        if (toggleText) toggleText.textContent = "Already have an account?";
        if (toggleBtn) toggleBtn.textContent = "Log in";
      } else {
        if (formTitle) formTitle.textContent = "Log in";
        if (formSubtitle) formSubtitle.textContent = "Find colleges you can actually afford.";
        if (submitBtn) submitBtn.textContent = "Log in";
        if (toggleText) toggleText.textContent = "Don't have an account?";
        if (toggleBtn) toggleBtn.textContent = "Sign up";
      }
    });
  }
 // Active user pipeline credential submittal handler 
  if (loginForm) {
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!errorMsg || !emailField || !passwordField) return;

      errorMsg.textContent = "";
      errorMsg.style.display = "none";

      const email = emailField.value.trim();
      const password = passwordField.value;

      try {
        if (mode === "signup") {
          await auth.createUserWithEmailAndPassword(email, password);
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
        window.location.href = "profile.html";
      } catch (error) {
        console.error("Firebase Authentication Fault:", error.code);
        errorMsg.style.display = "block";

        switch (error.code) {
          case "auth/invalid-email":
            errorMsg.textContent = "❌ The format of this email address is invalid.";
            break;
          case "auth/weak-password":
            errorMsg.textContent = "❌ Password is too weak. Make it at least 6 characters.";
            break;
          case "auth/email-already-in-use":
            errorMsg.textContent = "❌ This email address is already registered to an account.";
            break;
          case "auth/wrong-password":
          case "auth/user-not-found":
          case "auth/invalid-credential":
            errorMsg.textContent = "❌ Incorrect email or password credentials. Please try again.";
            break;
          case "auth/too-many-requests":
            errorMsg.textContent = "⚠️ Account locked temporarily due to too many failed attempts.";
            break;
          default:
            errorMsg.textContent = `❌ Authentication failure: ${error.message}`;
        }
      }
    });
  }

  // Modal Popup Interface Control
  const openResetModalBtn = document.getElementById("open-reset-modal-btn");
  const sendResetBtn = document.getElementById("send-reset-btn");
  const resetEmailInput = document.getElementById("reset-email");
  const resetMessage = document.getElementById("reset-message");
  const modal = document.getElementById("reset-modal");
  const closeModal = document.getElementById("close-modal");

  if (openResetModalBtn && modal) {
    openResetModalBtn.addEventListener("click", () => { modal.style.display = "flex"; });
  }

  if (closeModal && modal) {
    closeModal.addEventListener("click", () => { modal.style.display = "none"; if (resetMessage) resetMessage.style.display = "none"; });
    window.addEventListener("click", (e) => { if (e.target === modal) { modal.style.display = "none"; if (resetMessage) resetMessage.style.display = "none"; } });
  }

  if (sendResetBtn && resetEmailInput && resetMessage) {
    sendResetBtn.addEventListener("click", async () => {
      const email = resetEmailInput.value.trim();

      if (!email) {
        resetMessage.style.display = "block";
        resetMessage.style.color = "#ef4444";
        resetMessage.textContent = "Please enter an email address first.";
        return;
      }

      sendResetBtn.textContent = "Sending...";
      sendResetBtn.disabled = true;

      try {
        await auth.sendPasswordResetEmail(email);
        resetMessage.style.display = "block";
        resetMessage.style.color = "#27ae60";
        resetMessage.textContent = "Success! Check your email inbox for your magic link.";
        resetEmailInput.value = ""; 
      } catch (error) {
        resetMessage.style.display = "block";
        resetMessage.style.color = "#ef4444";
        if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
          resetMessage.textContent = "We couldn't find an account matching that email.";
        } else {
          resetMessage.textContent = "Error: " + error.message;
        }
      } finally {
        sendResetBtn.textContent = "Send reset link";
        sendResetBtn.disabled = false;
      }
    });
  }
</script>

<!-- POPUP MODAL (Hidden by default) -->
<div id="reset-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
  <div class="modal-content" style="background: white; padding: 2.5rem 2rem; border-radius: 12px; width: 90%; max-width: 400px; position: relative; color: #333; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
    <span id="close-modal" style="position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 1.5rem; color: #888; font-weight: bold;">&times;</span>
    <h3 style="margin-top: 0; font-family: 'Fraunces', serif; font-size: 24px; margin-bottom: 8px;">Reset your password</h3>
    <p style="font-size: 0.9rem; margin-bottom: 1.5rem; color: #666; line-height: 1.4;">Enter your account email and we'll send you a secure link to choose a new password.</p>
