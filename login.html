<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="nav">
        <div class="nav-inner">
            <a href="index.html" class="wordmark">CapItNJ</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="improve.html">Improve</a>
                <a href="explore.html">Explore</a>
                <a href="matches.html">Matches</a>
                <a href="mylist.html">My List</a>
                <a href="profile.html">Profile</a>
                <a href="support.html">Support</a>
            </div>
        </div>
    </header>

    <main>
        <div class="wrap">
            <div style="max-width: 320px; margin: 60px auto;">
                <h1>Log in</h1>
                <p style="color: var(--ink-soft); margin: 0 0 24px; font-size: 14px;">Enter your email and password to continue.</p>

                <form id="login-form">
                    <div class="field">
                        <label>email or username</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="field">
                        <label>password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" id="submit-btn" class="btn" style="width: 100%; margin-bottom: 12px;">Log in</button>
                </form>

                <button type="button" id="toggle-btn" class="btn-outline" style="width: 100%; margin-bottom: 20px;">Create account</button>

                <div style="text-align: center;">
                    <button type="button" id="open-reset-modal-btn" style="background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: underline;">Forgot password?</button>
                </div>

                <div id="error-message" style="display: none; background: #FEF1F1; border: 1px solid #E3C9C7; color: #B3413A; padding: 12px; border-radius: 2px; margin-top: 20px; font-size: 13px;"></div>
            </div>
        </div>
    </main>

    <!-- SIGNUP MODAL -->
    <div id="signup-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center;">
        <div style="background: white; padding: 32px; border-radius: 4px; max-width: 320px; width: 90%;">
            <h2 style="margin-top: 0;">Create account</h2>
            <p style="color: var(--ink-soft); margin: 0 0 24px; font-size: 14px;">Sign up to get started.</p>

            <form id="signup-form">
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" id="signup-name" required>
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="signup-email" required>
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="signup-password" required>
                </div>
                <div class="field">
                    <label>Confirm Password</label>
                    <input type="password" id="signup-confirm" required>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-bottom: 12px;">Create account</button>
                <button type="button" class="btn-outline" style="width: 100%;" onclick="closeSignupModal()">Back</button>
            </form>

            <div id="signup-error" style="display: none; background: #FEF1F1; border: 1px solid #E3C9C7; color: #B3413A; padding: 12px; border-radius: 2px; margin-top: 12px; font-size: 13px;"></div>
        </div>
    </div>

    <!-- RESET MODAL -->
    <div id="reset-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center;">
        <div style="background: white; padding: 32px; border-radius: 4px; max-width: 320px; width: 90%;">
            <h2 style="margin-top: 0;">Reset password</h2>
            <p style="color: var(--ink-soft); margin: 0 0 24px; font-size: 14px;">Enter your email to receive a reset link.</p>

            <form id="reset-form">
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="reset-email" required>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-bottom: 12px;">Send reset link</button>
                <button type="button" class="btn-outline" style="width: 100%;" onclick="closeResetModal()">Back</button>
            </form>

            <div id="reset-error" style="display: none; background: #FEF1F1; border: 1px solid #E3C9C7; color: #B3413A; padding: 12px; border-radius: 2px; margin-top: 12px; font-size: 13px;"></div>
        </div>
    </div>

    <footer class="home-footer">
        <div class="wrap">
            <p>© 2024 CapItNJ. Built for the Congressional App Challenge.</p>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
    <script src="firebase-init.js"></script>

    <script>
        function showError(elementId, message) {
            const errorEl = document.getElementById(elementId);
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function clearError(elementId) {
            const errorEl = document.getElementById(elementId);
            errorEl.style.display = 'none';
        }

        // LOGIN
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            clearError('error-message');

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            console.log('Login attempt:', email);

            window.capitnjFirebase.authFns.signInWithEmail(email, password)
                .then(userCredential => {
                    const user = userCredential.user;
                    console.log('Login successful:', user.uid);

                    // Fetch user profile from Firestore
                    window.capitnjFirebase.db.collection('users').doc(user.uid).get().then(doc => {
                        if (doc.exists()) {
                            const profile = doc.data();
                            localStorage.setItem('userLoggedIn', 'true');
                            localStorage.setItem('userProfile', JSON.stringify(profile));
                        } else {
                            // Create minimal profile
                            const newProfile = {
                                name: '',
                                email: user.email,
                                state: '',
                                gpa: '',
                                sat: null,
                                act: null,
                                budget: '',
                                preferredLocation: ''
                            };
                            localStorage.setItem('userLoggedIn', 'true');
                            localStorage.setItem('userProfile', JSON.stringify(newProfile));
                        }
                        window.location.href = 'profile.html';
                    }).catch(err => {
                        console.error('Error fetching profile:', err);
                        showError('error-message', 'Error loading profile. Please try again.');
                    });
                })
                .catch(error => {
                    console.error('Login error:', error.code, error.message);
                    if (error.code === 'auth/user-not-found') {
                        showError('error-message', 'Email not found.');
                    } else if (error.code === 'auth/wrong-password') {
                        showError('error-message', 'Incorrect password.');
                    } else {
                        showError('error-message', 'Login failed: ' + error.message);
                    }
                });
        });

        // SIGNUP
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            clearError('signup-error');

            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-confirm').value;

            if (password !== confirm) {
                showError('signup-error', 'Passwords do not match.');
                return;
            }

            if (password.length < 6) {
                showError('signup-error', 'Password must be at least 6 characters.');
                return;
            }

            console.log('Signup attempt:', email);

            window.capitnjFirebase.authFns.createUserWithEmail(email, password)
                .then(userCredential => {
                    const user = userCredential.user;
                    console.log('Signup successful:', user.uid);

                    const newProfile = {
                        name: name,
                        email: email,
                        state: '',
                        gpa: '',
                        sat: null,
                        act: null,
                        budget: '',
                        preferredLocation: ''
                    };

                    // Save to Firestore
                    window.capitnjFirebase.db.collection('users').doc(user.uid).set(newProfile)
                        .then(() => {
                            localStorage.setItem('userLoggedIn', 'true');
                            localStorage.setItem('userProfile', JSON.stringify(newProfile));
                            closeSignupModal();
                            window.location.href = 'profile.html';
                        })
                        .catch(err => {
                            console.error('Error saving profile:', err);
                            showError('signup-error', 'Error creating profile. Please try again.');
                        });
                })
                .catch(error => {
                    console.error('Signup error:', error.code, error.message);
                    if (error.code === 'auth/email-already-in-use') {
                        showError('signup-error', 'Email already in use.');
                    } else if (error.code === 'auth/invalid-email') {
                        showError('signup-error', 'Invalid email address.');
                    } else {
                        showError('signup-error', 'Signup failed: ' + error.message);
                    }
                });
        });

        // PASSWORD RESET
        document.getElementById('reset-form').addEventListener('submit', function(e) {
            e.preventDefault();
            clearError('reset-error');

            const email = document.getElementById('reset-email').value;

            console.log('Reset attempt:', email);

            window.capitnjFirebase.db.collection('users').where('email', '==', email).get()
                .then(querySnapshot => {
                    if (querySnapshot.empty) {
                        showError('reset-error', 'Email not found.');
                        return;
                    }

                    // Email exists, send reset link
                    const resetModule = window.capitnjFirebase.auth;
                    resetModule.sendPasswordResetEmail(email)
                        .then(() => {
                            console.log('Reset email sent');
                            showError('reset-error', 'Reset link sent to your email.');
                            document.getElementById('reset-error').style.background = '#E8F5E9';
                            document.getElementById('reset-error').style.borderColor = '#81C784';
                            document.getElementById('reset-error').style.color = '#2E7D32';
                        })
                        .catch(error => {
                            console.error('Reset error:', error);
                            showError('reset-error', 'Error sending reset link: ' + error.message);
                        });
                })
                .catch(error => {
                    console.error('Database error:', error);
                    showError('reset-error', 'Error checking email. Please try again.');
                });
        });

        // MODAL CONTROLS
        document.getElementById('toggle-btn').addEventListener('click', function() {
            document.getElementById('signup-modal').style.display = 'flex';
        });

        function closeSignupModal() {
            document.getElementById('signup-modal').style.display = 'none';
        }

        document.getElementById('open-reset-modal-btn').addEventListener('click', function() {
            document.getElementById('reset-modal').style.display = 'flex';
        });

        function closeResetModal() {
            document.getElementById('reset-modal').style.display = 'none';
        }

        // Close modals when clicking outside
        document.getElementById('signup-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeSignupModal();
            }
        });

        document.getElementById('reset-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeResetModal();
            }
        });

        // Check if already logged in
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('userLoggedIn') === 'true') {
                window.location.href = 'profile.html';
            }
        });
    </script>
</body>
</html>
