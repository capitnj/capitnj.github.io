<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CapItNJ — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="auth-wordmark" style="text-decoration:none;color:inherit">CapItNJ</a>

    <h1 id="form-title">Log in</h1>
    <p class="subtitle" id="form-subtitle">Find colleges you can actually afford.</p>

    <form id="auth-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" minlength="6">
      </div>
      <p class="error" id="error-msg"></p>
      <p class="form-help" style="margin-bottom: 1rem; font-size: 0.9rem;">
  <a href="#" id="forgot-password-link" style="color: #666; text-decoration: underline;">Forgot your password?</a>
</p>
      <button type="submit" class="btn" id="submit-btn" style="width:100%">Log in</button>
    </form>

    <p class="auth-toggle">
      <span id="toggle-text">Don't have an account?</span>
      <button class="link-btn" id="toggle-btn" type="button">Sign up</button>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script type="module" src="firebase-init.js"></script>
 <script type="module">

  const form = document.getElementById('auth-form');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const errorMsg = document.getElementById('error-msg');
  const toggleBtn = document.getElementById('toggle-btn');
  const toggleText = document.getElementById('toggle-text');
  const formTitle = document.getElementById('form-title');
  const formSubtitle = document.getElementById('form-subtitle');
  const submitBtn = document.getElementById('submit-btn');

  // If already logged in, skip straight to profile.
  auth.onAuthStateChanged((user) => {
    if (user) window.location.href = "profile.html";
  });

  toggleBtn.addEventListener('click', () => {
    mode = mode === "login" ? "signup" : "login";
    errorMsg.textContent = "";
    if (mode === "signup") {
      formTitle.textContent = "Create your account";
      formSubtitle.textContent = "Takes less than a minute.";
      submitBtn.textContent = "Sign up";
      toggleText.textContent = "Already have an account?";
      toggleBtn.textContent = "Log in";
    } else {
      formTitle.textContent = "Log in";
      formSubtitle.textContent = "Find colleges you can actually afford.";
      submitBtn.textContent = "Log in";
      toggleText.textContent = "Don't have an account?";
      toggleBtn.textContent = "Sign up";
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = "";
    submitBtn.disabled = true;

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    try {
      if (mode === "signup") {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection('users').doc(cred.user.uid).set({
          email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } else {
        await auth.signInWithEmailAndPassword(email, password);
      }
      window.location.href = "profile.html";
    } catch (err) {
      errorMsg.textContent = friendlyError(err.code);
      submitBtn.disabled = false;
    }
  });

  function friendlyError(code) {
    switch (code) {
      case 'auth/email-already-in-use': return "That email already has an account — try logging in instead.";
      case 'auth/invalid-email': return "That email doesn't look right.";
      case 'auth/weak-password': return "Password needs to be at least 6 characters.";
      case 'auth/user-not-found':
      case 'auth/wrong-password':
      case 'auth/invalid-credential': return "Email or password is incorrect.";
      default: return "Something went wrong — try again.";
    }
  }
  // Modal interaction script
document.addEventListener("DOMContentLoaded", () => {
  const forgotLink = document.getElementById("forgot-password-link");
  const modal = document.getElementById("reset-modal");
  const closeModal = document.getElementById("close-modal");

  if (forgotLink && modal && closeModal) {
    // Open modal when clicking "Forgot your password?"
    forgotLink.addEventListener("click", (e) => {
      e.preventDefault();
      modal.style.display = "flex";
    });

    // Close modal when clicking the 'X'
    closeModal.addEventListener("click", () => {
      modal.style.display = "none";
    });

    // Close modal when clicking outside the white box
    window.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.style.display = "none";
      }
    });
  }
// Grab elements for the reset action
  const sendResetBtn = document.getElementById("send-reset-btn");
  const resetEmailInput = document.getElementById("reset-email");
  const resetMessage = document.getElementById("reset-message");

  if (sendResetBtn && resetEmailInput && resetMessage) {
    sendResetBtn.addEventListener("click", async () => {
      const email = resetEmailInput.value.trim();

      if (!email) {
        resetMessage.style.display = "block";
        resetMessage.style.color = "red";
        resetMessage.textContent = "Please enter an email address first.";
        return;
      }

      sendResetBtn.textContent = "Sending...";
      sendResetBtn.disabled = true;

      try {
        await auth.sendPasswordResetEmail(email);
        resetMessage.style.display = "block";
        resetMessage.style.color = "green";
        resetMessage.textContent = "Success! Check your email inbox for your magic link.";
        resetEmailInput.value = ""; 
      } catch (error) {
        resetMessage.style.display = "block";
        resetMessage.style.color = "red";
        
        if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
          resetMessage.textContent = "We couldn't find an account matching that email.";
        } else if (error.code === 'auth/invalid-email') {
          resetMessage.textContent = "That email address doesn't look right.";
        } else {
          resetMessage.textContent = "Error: " + error.message;
        }
      } finally {
        sendResetBtn.textContent = "Send reset link";
        sendResetBtn.disabled = false;
      }
    });
  }
});
</script>
<!-- POPUP MODAL (Hidden by default) -->
<div id="reset-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
  <div class="modal-content" style="background: white; padding: 2rem; border-radius: 8px; width: 90%; max-width: 400px; position: relative; color: #333;">
    <span id="close-modal" style="position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 1.5rem; color: #666;">&times;</span>
    <h3 style="margin-top: 0;">Reset your password</h3>
    <p style="font-size: 0.9rem; margin-bottom: 1rem; color: #666; line-height: 1.4;">Enter your account email and we'll send you a secure link to choose a new password.</p>
    
    <div class="field" style="margin-bottom: 1rem;">
      <label for="reset-email">Email Address</label>
      <input type="email" id="reset-email" placeholder="you@example.com" style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
    </div>
    <button id="send-reset-btn" class="btn" type="button" style="width: 100%;">Send reset link</button>
    <p id="reset-message" style="margin-top: 1rem; font-size: 0.9rem; display: none;"></p>
  </div>
</div>
</body>
</html>
